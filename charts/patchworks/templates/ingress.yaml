{{- if .Values.ingress.enabled }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $ing := .Values.ingress }}
{{- $services := list
  (dict "host" $ing.hosts.gateway  "svcName" (printf "%s-gateway"  $fullname) "ns" (include "patchworks.gateway.namespace"  .))
  (dict "host" $ing.hosts.start    "svcName" (printf "%s-start"    $fullname) "ns" (include "patchworks.start.namespace"    .))
  (dict "host" $ing.hosts.fabric   "svcName" (printf "%s-fabric"   $fullname) "ns" (include "patchworks.fabric.namespace"   .))
  (dict "host" $ing.hosts.dashboard "svcName" (printf "%s-dashboard" $fullname) "ns" (include "patchworks.dashboard.namespace" .))
}}
{{- range $services }}
{{- if .host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .svcName }}
  namespace: {{ .ns }}
  labels:
    {{- include "patchworks.labels" $ | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $ing.className }}
  ingressClassName: {{ $ing.className }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .svcName }}
                port:
                  name: http
{{- end }}
{{- end }}
{{- end }}
