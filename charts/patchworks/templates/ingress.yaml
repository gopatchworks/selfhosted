{{- if .Values.ingress.enabled }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $ing := .Values.ingress }}
{{- $services := list
  (dict "host" $ing.hosts.gateway "svcName" (printf "%s-gateway"  $fullname) "ns" (include "patchworks.gateway.namespace"  .))
  (dict "host" $ing.hosts.start   "svcName" (printf "%s-start"    $fullname) "ns" (include "patchworks.start.namespace"    .))
  (dict "host" $ing.hosts.fabric  "svcName" (printf "%s-fabric"   $fullname) "ns" (include "patchworks.fabric.namespace"   .))
}}
{{- range $services }}
{{- if .host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .svcName }}
  namespace: {{ .ns }}
  labels:
    {{- include "patchworks.labels" $ | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $ing.className }}
  ingressClassName: {{ $ing.className }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .svcName }}
                port:
                  name: http
{{- end }}
{{- end }}
{{- if $ing.hosts.dashboard }}
{{- $dashNs := include "patchworks.dashboard.namespace" . }}
{{- if eq $ing.provider "contour" }}
---
# Contour HTTPProxy — native prefix rewriting for /fabric, /core-main, /core-start
# and catch-all to dashboard. Requires the Contour CRD (projectcontour.io/v1).
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ $fullname }}-dashboard
  namespace: {{ $dashNs }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  virtualhost:
    fqdn: {{ $ing.hosts.dashboard | quote }}
    {{- if $ing.tls }}
    {{- $tlsSecret := "" }}
    {{- range $ing.tls }}
    {{- if and (not $tlsSecret) (has $ing.hosts.dashboard .hosts) }}
    {{- $tlsSecret = .secretName }}
    {{- end }}
    {{- end }}
    {{- if $tlsSecret }}
    tls:
      secretName: {{ $tlsSecret | quote }}
    {{- end }}
    {{- end }}
  routes:
    - conditions:
        - prefix: /fabric
      pathRewritePolicy:
        replacePrefix:
          - replacement: /
      services:
        - name: {{ $fullname }}-fabric
          port: 80
    - conditions:
        - prefix: /core-main
      pathRewritePolicy:
        replacePrefix:
          - replacement: /
      services:
        - name: {{ $fullname }}-gateway
          port: 80
    - conditions:
        - prefix: /core-start
      pathRewritePolicy:
        replacePrefix:
          - replacement: /
      services:
        - name: {{ $fullname }}-start
          port: 80
    - conditions:
        - prefix: /
      services:
        - name: {{ $fullname }}-dashboard
          port: 80
{{- else }}
---
# Path-rewriting Ingress — strips /fabric, /core-main, /core-start prefixes
# before forwarding to their respective services.
# See ingress.rewriteAnnotations in values.yaml for controller-specific config.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-dashboard-routes
  namespace: {{ $dashNs }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
  annotations:
    {{- with $ing.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $ing.rewriteAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if $ing.className }}
  ingressClassName: {{ $ing.className }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $ing.hosts.dashboard | quote }}
      http:
        paths:
          - path: /fabric
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-fabric
                port:
                  name: http
          - path: /core-main
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-gateway
                port:
                  name: http
          - path: /core-start
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-start
                port:
                  name: http
---
# Dashboard Ingress — serves the dashboard at /.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-dashboard
  namespace: {{ $dashNs }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $ing.className }}
  ingressClassName: {{ $ing.className }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $ing.hosts.dashboard | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-dashboard
                port:
                  name: http
{{- end }}
{{- end }}
{{- end }}
