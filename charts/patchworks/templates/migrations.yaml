{{- if .Values.migrations.enabled }}
---
# Job — runs database migrations after all chart resources are deployed.
# Executed as a post-install / post-upgrade hook so in-cluster infrastructure
# (MySQL) is available before migrations run. App pods may briefly restart
# while waiting for the schema; Kubernetes restarts handle this automatically.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "patchworks.fullname" . }}-core-migrations
  namespace: {{ include "patchworks.migrations.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-migrations
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "core-migrations" "Release" .Release) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "patchworks.serviceAccountName" . }}
      restartPolicy: {{ .Values.migrations.restartPolicy }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL..."
              until mysqladmin ping -h {{ include "patchworks.mysql.host" . }} -P {{ include "patchworks.mysql.port" . }} --silent; do sleep 2; done
              echo "MySQL ready."
      containers:
        - name: core-migrations
          image: {{ include "patchworks.appImage" (dict "svc" .Values.migrations "root" .) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" .Values.migrations "root" .) }}
          command: ["/bin/sh", "-c", {{ .Values.migrations.command | quote }}]
          envFrom:
            - configMapRef:
                name: {{ include "patchworks.fullname" . }}-config
            - secretRef:
                name: {{ include "patchworks.fullname" . }}-secret
            - secretRef:
                name: {{ include "patchworks.passportSecretName" . }}
            {{- with .Values.app.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "patchworks.appSecretEnvRefs" . | nindent 12 }}
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.migrations.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
