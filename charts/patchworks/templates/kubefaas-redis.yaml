{{- if and .Values.kubefaas.enabled .Values.kubefaas.redis.enabled }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $ns := include "patchworks.kubefaas.namespace" . }}
{{- $kf := .Values.kubefaas }}
{{- $p := $kf.redis.persistence }}
{{- if not $p.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-kubefaas-redis
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-redis
spec:
  {{- include "patchworks.pvcSpec" $p | nindent 2 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-kubefaas-redis
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "patchworks.selectorLabels" (dict "component" "kubefaas-redis" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "kubefaas-redis" "Release" .Release) | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ $kf.redis.image.repository }}:{{ $kf.redis.image.tag }}
          imagePullPolicy: {{ $kf.redis.image.pullPolicy }}
          args:
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with $kf.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $p.existingClaim | default (printf "%s-kubefaas-redis" $fullname) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-kubefaas-redis
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-redis
spec:
  type: ClusterIP
  selector:
    {{- include "patchworks.selectorLabels" (dict "component" "kubefaas-redis" "Release" .Release) | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
