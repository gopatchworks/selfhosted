---
# ConfigMap for non-sensitive core application environment variables.
# Mounted via envFrom in gateway, start, workers, migrations, and seeds pods.
# A checksum of this ConfigMap's data drives rolling restarts on config changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "patchworks.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
data:
  {{- include "patchworks.appConfigData" . | nindent 2 }}
