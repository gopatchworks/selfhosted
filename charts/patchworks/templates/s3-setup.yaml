{{- if .Values.s3.enabled }}
---
# Job — creates the baseline S3 bucket on first install and after upgrades.
# Runs as a post-install / post-upgrade hook so MinIO is already running when
# this job executes. Skipped when s3.enabled is false (BYO bucket).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "patchworks.fullname" . }}-s3-setup
  namespace: {{ include "patchworks.s3.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3-setup
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "s3-setup" "Release" .Release) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              echo "Waiting for MinIO..."
              until nc -z {{ include "patchworks.s3.host" . }} 9000; do sleep 2; done
              echo "MinIO ready."
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - sh
            - -c
            - |
              mc alias set local {{ include "patchworks.s3.endpoint" . }} "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing local/{{ .Values.s3.bucket }}
              echo "Bucket {{ .Values.s3.bucket }} ready."
              {{- if and .Values.kubefaas.enabled .Values.kubefaas.builder.cacheBucket }}
              mc mb --ignore-existing local/{{ .Values.kubefaas.builder.cacheBucket }}
              echo "Bucket {{ .Values.kubefaas.builder.cacheBucket }} ready."
              {{- end }}
          env:
            {{- $es := .Values.s3.auth.existingSecret }}
            {{- include "patchworks.secretEnv" (dict "name" "MINIO_ROOT_USER" "value" .Values.s3.auth.rootUser "secret" (dict "name" $es.name "key" $es.rootUserKey)) | nindent 12 }}
            {{- include "patchworks.secretEnv" (dict "name" "MINIO_ROOT_PASSWORD" "value" .Values.s3.auth.rootPassword "secret" (dict "name" $es.name "key" $es.rootPasswordKey)) | nindent 12 }}
{{- end }}
