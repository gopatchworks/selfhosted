{{- if .Values.dashboard.enabled }}
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "patchworks.fullname" . }}-dashboard
  namespace: {{ include "patchworks.dashboard.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  {{- with .Values.dashboard.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "patchworks.selectorLabels" (dict "component" "dashboard" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "dashboard" "Release" .Release) | nindent 8 }}
      {{- with .Values.dashboard.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "patchworks.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "patchworks.waitForDeps" . | nindent 8 }}
      containers:
        - name: dashboard
          image: {{ include "patchworks.appImage" (dict "svc" .Values.dashboard "root" .) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" .Values.dashboard "root" .) }}
          ports:
            - name: http
              containerPort: 80
          env:
            {{- $fullname := include "patchworks.fullname" . }}
            {{- $scheme := ternary "https" "http" (gt (len .Values.ingress.tls) 0) }}
            {{- $ingressGateway := .Values.ingress.hosts.gateway | default "" }}
            {{- $ingressStart   := .Values.ingress.hosts.start   | default "" }}
            {{- $ingressFabric  := .Values.ingress.hosts.fabric  | default "" }}
            {{- $coreUrl   := .Values.dashboard.coreUrl   | default (ternary (printf "%s://%s" $scheme $ingressGateway) (printf "http://%s-gateway.%s.svc.cluster.local" $fullname (include "patchworks.gateway.namespace" .)) (ne $ingressGateway "")) }}
            {{- $startUrl  := .Values.dashboard.startUrl  | default (ternary (printf "%s://%s" $scheme $ingressStart)   (printf "http://%s-start.%s.svc.cluster.local"   $fullname (include "patchworks.start.namespace" .))   (ne $ingressStart "")) }}
            {{- $fabricUrl := .Values.dashboard.fabricUrl | default (ternary (printf "%s://%s" $scheme $ingressFabric)  (printf "http://%s-fabric.%s.svc.cluster.local"  $fullname (include "patchworks.fabric.namespace" .))  (ne $ingressFabric "")) }}
            {{- $mcpUrl    := .Values.dashboard.mcpUrl    | default (ternary (printf "%s://%s/api/v1/mcp" $scheme $ingressGateway) (printf "http://%s-gateway.%s.svc.cluster.local/api/v1/mcp" $fullname (include "patchworks.gateway.namespace" .)) (ne $ingressGateway "")) }}
            - name: CORE_URL
              value: {{ $coreUrl | quote }}
            - name: START_URL
              value: {{ $startUrl | quote }}
            - name: FABRIC_URL
              value: {{ $fabricUrl | quote }}
            - name: MCP_URL
              value: {{ $mcpUrl | quote }}
            - name: INBOUND_URL
              value: {{ .Values.dashboard.inboundUrl | quote }}
            - name: GA4_TAG
              value: {{ .Values.dashboard.ga4Tag | quote }}
            - name: ZENDESK_URL
              value: {{ .Values.dashboard.zendeskUrl | quote }}
            - name: FORCE_REGISTRATION_REQUEST
              value: {{ .Values.dashboard.forceRegistrationRequest | quote }}
            {{- include "patchworks.appEnv" . | nindent 12 }}
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.dashboard.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with (concat .Values.app.extraEnvFrom .Values.dashboard.extraEnvFrom) }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.dashboard.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "patchworks.fullname" . }}-dashboard
  namespace: {{ include "patchworks.dashboard.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  selector:
    {{- include "patchworks.selectorLabels" (dict "component" "dashboard" "Release" .Release) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
{{- end }}
