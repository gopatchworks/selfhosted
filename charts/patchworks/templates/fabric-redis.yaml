{{- if .Values.fabric.redis.enabled }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $ns := include "patchworks.fabric.namespace" . }}
{{- $redis := .Values.fabric.redis }}
{{- $p := $redis.persistence }}
{{- if not $p.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-fabric-redis
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: fabric-redis
spec:
  {{- include "patchworks.pvcSpec" $p | nindent 2 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-fabric-redis
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: fabric-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "patchworks.selectorLabels" (dict "component" "fabric-redis" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "fabric-redis" "Release" .Release) | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: "{{ $redis.image.repository }}:{{ $redis.image.tag }}"
          imagePullPolicy: {{ $redis.image.pullPolicy }}
          ports:
            - name: redis
              containerPort: 6379
          command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with $redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $p.existingClaim | default (printf "%s-fabric-redis" $fullname) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-fabric-redis
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: fabric-redis
spec:
  type: {{ $redis.service.type }}
  selector:
    {{- include "patchworks.selectorLabels" (dict "component" "fabric-redis" "Release" .Release) | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
