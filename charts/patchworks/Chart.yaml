apiVersion: v2
name: patchworks
description: >
  Self-hosted Patchworks Core — includes the core web application, workers,
  migrations, and optional bundled infrastructure (MySQL, Redis, Elasticsearch,
  MinIO/S3).  Designed for production self-hosting; bring-your-own infrastructure
  services are supported for all stateful dependencies.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - patchworks
  - self-hosted
  - core
dependencies:
  - name: soketi
    version: "2.0.0"
    repository: "https://helm.soketi.app"
    condition: pusher.enabled
