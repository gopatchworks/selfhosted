# ── Global image config ────────────────────────────────────────────────────────
# Applies to all Patchworks application images (web, workers,
# migrations, monocore). Infrastructure images (mysql, redis, etc.) use
# their own fully-qualified image blocks and are unaffected by this section.
image:
  registry: quay.io/patchworks
  # Default image name for PHP app components (web, workers, migrations).
  # Monocore, fabric, and dashboard override this with their own repository.
  repository: core
  tag: v0.1.19
  pullPolicy: IfNotPresent
  # List of image pull secret names to attach to all app pods.
  pullSecrets: []

# ── Application runtime (app chart passthrough) ───────────────────────────────
# Controls how PHP app images are started. The infra chart keeps these values so
# one shared values file can be used for both charts; it does not render PHP app
# runtime resources. The default uses standard PHP runtime images.
runtime:
  frankenphp:
    enabled: false

# Number of old ReplicaSets retained for chart-managed Deployments.
revisionHistoryLimit: 3

# ── Service account ────────────────────────────────────────────────────────────
# Shared ServiceAccount used by all app pods (gateway, start, fabric, workers,
# dashboard, migrations). imagePullSecrets from image.pullSecrets are attached.
serviceAccount:
  # Set to false to skip creation and use an existing account instead.
  create: true
  # Override the name. Defaults to the release fullname when empty.
  name: ""
  # Annotations to add to the ServiceAccount (e.g. for IRSA/Workload Identity).
  annotations: {}

# ── Application shared config ──────────────────────────────────────────────────
# Injected into all Patchworks application pods (web, workers, migrations).
app:
  # Laravel APP_KEY. Leave empty to auto-generate a stable key Secret on install.
  # To provide one manually: echo "base64:$(openssl rand -base64 32)"
  key: ""
  # Use an existing Secret instead of the inline key value above.
  # When both name and key are set, APP_KEY is sourced via secretKeyRef.
  existingSecret:
    name: ""
    key: APP_KEY
  env: production
  debug: "false"
  url: "http://localhost"
  # License values required by encoded Core and Fabric images.
  # Use existingSecret for production so the license key is not stored in values.
  license:
    active: "true"
    key: ""
    # License server URL. Rendered as LICENSE_SERVER_URL for Core and LICENSE_URL for Fabric.
    serverUrl: "https://license.wearepatchworks.com"
    existingSecret:
      name: ""
      keyKey: LICENSE_KEY
      # Optional key containing the license server URL. Used for both LICENSE_SERVER_URL and LICENSE_URL.
      serverUrlKey: ""
  # Extra env vars injected into every app pod.
  extraEnv: []
  # Extra envFrom (secretRef / configMapRef) injected into every app pod.
  extraEnvFrom: []

# ── Passport OAuth keys ────────────────────────────────────────────────────────
# Laravel Passport RSA key pair shared between Core and Fabric.
# An RSA-4096 key pair is auto-generated on first install and stored in a
# dedicated Secret annotated with helm.sh/resource-policy: keep so it survives
# upgrades and uninstalls.
# Set existingSecret.name to bring your own key pair instead.
passport:
  existingSecret:
    name: ""
    privateKeyKey: PASSPORT_PRIVATE_KEY
    publicKeyKey: PASSPORT_PUBLIC_KEY

# ── Namespace override ─────────────────────────────────────────────────────────
# Optional global override. When set, all resources are deployed to this
# namespace unless a per-component namespace is specified. Defaults to the Helm
# release namespace when empty.
namespace: ""

# ── Credential generation ─────────────────────────────────────────────────────
# When enabled, empty in-cluster infrastructure credentials are generated once
# by the infra chart and stored in Kubernetes Secrets. The app chart resolves
# the same shared values to those Secret names.
credentials:
  autoGenerate: true
  generator:
    image:
      repository: alpine/kubectl
      tag: 1.36.1
      pullPolicy: IfNotPresent

# ── Core Web ───────────────────────────────────────────────────────────────────
# Shared defaults for the two HTTP-facing Laravel deployments (gateway + start).
# Any field under web.gateway.* or web.start.* overrides the corresponding
# web.* default for that sub-component only.
web:
  namespace: ""
  frankenphp: {}
  image:
    registry: ""
    tag: ""
    pullPolicy: ""
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  # Controls the cookie domain for authentication.
  sessionDomain: ""
  resources:
    requests:
      memory: 900Mi
  extraEnv: []
  extraEnvFrom: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Gateway — primary API / MCP-facing service.
  gateway:
    queue: gateway
    frankenphp: {}

  # Start — webhook, callback, and start-trigger service.
  start:
    queue: start
    frankenphp: {}

# ── Core Scheduler (app chart passthrough) ─────────────────────────────────────
# Shared defaults for processor scheduler CronJobs. The infra chart keeps these
# values so one shared values file can be used for both charts; it does not
# render scheduler resources.
scheduler:
  enabled: true
  frankenphp: {}
  schedule: "*/1 * * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  backoffLimit: 2
  activeDeadlineSeconds: 300
  restartPolicy: Never
  command:
    - /usr/local/bin/php
  args:
    - artisan
    - schedule:run
  resources:
    requests:
      cpu: 150m
      memory: 300M
    limits: {}
  extraEnv: []
  extraEnvFrom: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Core Processors ────────────────────────────────────────────────────────────
# Processor queues are always handled by PHP Core workers, even when
# workers.type=mono for the main flow worker. The infra chart uses this list to
# configure in-cluster RabbitMQ queues.
#
# The app chart also accepts per-processor scheduler overrides under:
#   scheduler:
#     schedule: "*/5 * * * *"
#     activeDeadlineSeconds: 7500
# Keep these values in the shared values file when applying both charts.
processors:
  # Used to schedule flows.
  - name: Start
    queue: start
    enabled: true
  # Used to process gateway background jobs.
  - name: Gateway
    queue: gateway
    enabled: true
  # Used for short background jobs.
  - name: Short Processor
    queue: short-processor
    enabled: true
  # Used for medium background jobs.
  - name: Medium Processor
    queue: medium-processor
    enabled: true
  # Used to run long background jobs.
  - name: Long Processor
    queue: long-processor
    enabled: true
  # Used for application broadcast/logging events.
  - name: Logging
    queue: logging
    enabled: true
    scheduler:
      enabled: false

# ── Fabric ─────────────────────────────────────────────────────────────────────
# PHP-FPM application fronted by an Nginx sidecar. Required component.
fabric:
  namespace: ""
  frankenphp: {}
  image:
    repository: fabric
    registry: quay.io/patchworks
    tag: v0.1.19
    pullPolicy: ""
  # Fabric migrations run before Core migrations as Helm hooks.
  migrations:
    enabled: true
    frankenphp: {}
    command: "php artisan migrate --force"
  # Shell command run as an init container before the app starts.
  init:
    frankenphp: {}
    command: "php artisan optimize"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  # Fabric web session settings. Laravel SESSION_LIFETIME is in minutes.
  session:
    driver: redis
    lifetime: 10080
  # ── Fabric MySQL ──────────────────────────────────────────────────────────
  # Fabric uses its own database, isolated from the core application.
  #
  # Three modes (evaluated in order):
  #   1. fabric.mysql.enabled: true  — deploy a dedicated MySQL instance.
  #   2. fabric.mysql.external.host  — connect to an existing MySQL instance.
  #   3. (default) shared            — use the main MySQL with a separate
  #                                    database (fabric.mysql.database).
  #
  # If the main mysql is disabled and neither of the above is configured,
  # the chart will fail with a validation error.
  mysql:
    enabled: false
    # Database name used when sharing the main MySQL instance (mode 3).
    database: fabric
    external:
      host: ""
      port: 3306
      database: fabric
      username: fabric
      password: ""
      existingSecret:
        name: ""
        passwordKey: password
    # Settings below are only used when fabric.mysql.enabled: true.
    image:
      repository: mysql
      tag: "8.0"
      pullPolicy: IfNotPresent
    maxConnections: 1000
    auth:
      rootPassword: ""
      database: fabric
      username: fabric
      password: ""
      existingSecret:
        name: ""
        rootPasswordKey: root-password
        passwordKey: password
    persistence:
      existingClaim: ""
      accessModes: [ReadWriteOnce]
      size: 10Gi
      storageClass: ""
      spec: {}
    service:
      type: ClusterIP
    resources: {}
  # ── Fabric Redis ──────────────────────────────────────────────────────────
  # Fabric can use its own Redis instance, isolated from the core application.
  #
  # Three modes (evaluated in order):
  #   1. fabric.redis.enabled: true  — deploy a dedicated Redis instance.
  #   2. fabric.redis.external.host  — connect to an existing Redis instance.
  #   3. (default) shared            — use the main Redis instance.
  redis:
    enabled: false
    external:
      host: ""
      port: 6379
      password: ""
      existingSecret:
        name: ""
        passwordKey: password
    # Settings below are only used when fabric.redis.enabled: true.
    image:
      repository: valkey/valkey
      tag: 8-alpine
      pullPolicy: IfNotPresent
    persistence:
      existingClaim: ""
      accessModes: [ReadWriteOnce]
      size: 1Gi
      storageClass: ""
      spec: {}
    service:
      type: ClusterIP
    resources: {}
  resources: {}
  extraEnv: []
  extraEnvFrom: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Dashboard ──────────────────────────────────────────────────────────────────
# Optional dashboard UI deployment.
dashboard:
  enabled: false
  namespace: ""
  image:
    repository: dashboard
    registry: quay.io/patchworks
    tag: v0.1.19
    pullPolicy: ""
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources: {}
  # Public service URLs rendered into the static dashboard config.js. When the
  # dashboard ingress host is configured and routingMode=path, these default to
  # the dashboard path-routed URLs (/core-main, /core-start, /fabric). Set
  # routingMode=host to prefer the dedicated service ingress hosts instead.
  # Valid values: path, host.
  routingMode: path
  coreUrl: ""
  startUrl: ""
  fabricUrl: ""
  mcpUrl: ""
  # Dashboard auth cookie domain. Defaults to web.sessionDomain when empty.
  authCookieDomain: ""
  # External/optional dashboard runtime config.
  inboundUrl: ""
  webhookHandlerUrl: "https://webhook-handler.pwks.co"
  broadcasting:
    host: ""
    port: ""
    scheme: ""
  ga4Tag: "none"
  zendeskUrl: "none"
  forceRegistrationRequest: "false"
  postmanImporter:
    enabled: "true"
    maxFileUploadSize: 50
  links:
    docs:
      allowances: ""

  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Core Migrations ────────────────────────────────────────────────────────────
# Runs as a Helm pre-install/pre-upgrade hook Job to apply database migrations
# before the application pods start.
migrations:
  enabled: true
  namespace: ""  # overrides global namespace for migration jobs
  frankenphp: {}
  image:
    registry: ""
    tag: ""
    pullPolicy: ""
  # Shell command to run. Supports chaining, e.g. "php artisan migrate --force && php artisan db:seed"
  command: "php artisan migrate --force"
  restartPolicy: Never
  # backoffLimit controls how many times the Job retries on failure.
  backoffLimit: 3
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []

# ── Seeds ──────────────────────────────────────────────────────────────────────
# One-shot Jobs that seed reference data on first install.
# Run by the app chart as pre-install hooks only (not upgrade). Fabric seeders
# run before core migrations; core seeders run after Fabric seeders and core
# migrations.
# Successful seed Jobs are intentionally retained by the app chart to prevent
# GitOps syncs from recreating them and re-running initial seed data after
# install.
# Seed Jobs can have side effects before failing, so they do not retry by default.
seeds:
  namespace: ""  # overrides global namespace; defaults to migrations namespace
  restartPolicy: Never
  backoffLimit: 0
  nodeSelector: {}
  affinity: {}
  tolerations: []

  # Fabric seeder — runs on pre-install only (not upgrade).
  # Runs before the Fabric company seeder, Core migrations, and Core seeds.
  # Must complete before core migrations and core seeds run.
  fabric:
    enabled: false
    frankenphp: {}
    command: >-
      php -r 'require "vendor/autoload.php"; if (! class_exists("Faker\\Factory")) { fwrite(STDERR, "Fabric seeders require fakerphp/faker. Rebuild the Fabric image with Composer dev dependencies installed; the encoded image build must not use --no-dev for the vendor stage.\n"); exit(1); }'
      && php artisan app:install
    image:
      registry: ""
      repository: fabric
      tag: ""
      pullPolicy: ""
    resources: {}

  # Initial tenant created by app:create-tenant during fabric seeding.
  # Company/name/email fields are required when seeds.fabric.enabled is true.
  # adminPassword is generated by the app chart when left empty.
  # Tier must be one of: Trial, App Store, Standard, Professional, Custom,
  # Partner Sandbox, Veeqo
  tenant:
    companyName: ""
    # Tenant database created by the app chart before core seeds run. Defaults
    # to companyName lowercased with non-alphanumeric characters removed.
    database: ""
    createDatabase: true
    tier: "Professional"
    adminName: ""
    adminEmail: ""
    userRole: "superadmin"
    adminPassword: ""
    # Supply the admin password from an existing Secret instead of the
    # inline value above.
    existingSecret:
      name: ""
      passwordKey: adminPassword

  # Core seeder — runs on pre-install only (not upgrade), after Core migrations.
  core:
    enabled: false
    frankenphp: {}
    command: "php artisan db:seed --force && php artisan migrate:tenants --create --no-interaction"
    image:
      registry: ""
      tag: ""
      pullPolicy: ""
    resources: {}

# ── Mapping Documents ─────────────────────────────────────────────────────────
# Mapping document storage shared by PHP core and monocore. By default monocore
# uses the main Elasticsearch connection; set these fields only when mapping
# documents need a different Elasticsearch endpoint or credentials.
mapping:
  elasticsearch:
    addresses: []
    cloudId: ""
    apiKey: ""
    username: ""
    password: ""
    index: mappings
    existingSecret:
      name: ""
      cloudIdKey: ""
      apiKeyKey: ""
      usernameKey: ""
      passwordKey: ""

# ── Monocore API ──────────────────────────────────────────────────────────────
# Consumed by the app chart and injected into Core app pods when workers.type is mono.
monocore:
  # Defaults to the in-cluster hub monocore Service when empty.
  url: ""
  timeout: 120

# ── Workers ───────────────────────────────────────────────────────────────────
workers:
  namespace: ""  # overrides global namespace for worker resources
  frankenphp: {}
  # Deployment type:
  #   standalone   — PHP queue worker via supervisord
  #   mono         — Monocore Go-based worker
  #   microservice — PHP queue worker per service via supervisord
  type: standalone

  # Image overrides for type: standalone / microservice (PHP workers).
  # Falls back to global image.* — same image as web by default.
  # For type: mono, configure workers.mono.image instead.
  image:
    registry: ""
    tag: ""
    pullPolicy: ""

  replicaCount: 1
  processes: 15
  resources:
    requests:
      memory: 900Mi
  extraEnv: []
  extraEnvFrom: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  notify:
    email:
      from: ""
    ses:
      region: ""
      endpoint: ""
    aws:
      role:
        arn: ""
      external:
        id: ""

  # ── type: standalone + mono ───────────────────────────────────────────────
  queue:
    connection: rabbitmq
    name: default

  # ── type: microservice ───────────────────────────────────────────────────
  # Each key (except _default) creates one or more Deployments — one for the
  # hub queue and one per entry in workers.companies.
  #
  # _default is the base template applied to every microservice. Per-service
  # keys override individual fields. Only name and domain are required per
  # service; everything else falls back to _default then workers.* globals.
  #
  # name   → APP_NAME env var
  # domain → APP_DOMAIN env var and the hub queue name
  # processes → numprocs in generated supervisord.conf (worker concurrency)
  #
  # Company workers (workers.companies) consume company.queue | default
  # company.name instead of the domain queue. Company-specific RabbitMQ queues
  # must be created manually — see the workers.companies note above.
  microservices:
    _default:
      enabled: true
      replicas: 1
      processes: 15
      namespace: ""
      resources: {}
      extraEnv: []
      extraEnvFrom: []
      podAnnotations: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}

    assert:
      name: Assert
      domain: assert

    batch:
      name: Batch
      domain: batch

    cache:
      name: Cache
      domain: cache

    callback:
      name: Callback
      domain: callback

    custom-script:
      name: Custom Script
      domain: custom-script

    dedupe:
      name: Dedupe
      domain: dedupe

    events:
      name: Events
      domain: events
      enabled: false

    filter:
      name: Filter
      domain: filter

    manual-input:
      name: Manual Input
      domain: manual-input

    notify:
      name: Notify
      domain: notify

    pull:
      name: Pull
      domain: pull

    push:
      name: Push
      domain: push

    route:
      name: Route
      domain: route

    split:
      name: Split
      domain: split

    track:
      name: Track
      domain: track

    translate:
      name: Translate
      domain: translate

    try-catch:
      name: Try Catch
      domain: try-catch

  # ── type: mono ────────────────────────────────────────────────────────────
  mono:
    # Monocore is a separate Go binary on its own release cycle.
    # Set tag independently from the PHP app image.tag.
    image:
      repository: monocore
      registry: quay.io/patchworks
      tag: v0.1.19
      pullPolicy: ""
    # Queue consumed by the hub monocore deployment. This matches monocore's
    # built-in topology default.
    queue: flows
    processes: 15
    extraEnv: []
    store:
      # Use an existing Secret containing monocore's store.yaml instead of
      # generating one from s3.* values. For cross-namespace company workers,
      # create the same Secret in each worker namespace.
      existingSecret:
        name: ""
        key: store.yaml

    # RabbitMQ topology options. The topology itself is auto-generated from
    # workers.mono.queue. Override only what you need to change.
    rabbitmq:
      vhost: /
      # Exchange used by monocore for flow publishes. Empty auto-selects
      # workers.mono.queue when companyFlows.enabled is false, or
      # customer-flows when companyFlows.enabled is true.
      flowExchange: ""
      # Optional chart-managed company-flow topology. Enable only when this
      # chart should create the flow exchange, company queues, bindings, and
      # fallback policy.
      companyFlows:
        enabled: false
      # Advanced: supply a full topology to replace the auto-generated one.
      # When non-empty, companyFlows is ignored.
      topology: {}

    logging:
      format: json
      addSource: true
      verbose: false

  # ── Company worker deployments (type: standalone and type: mono) ─────────
  # Each entry creates a separate Deployment consuming a company-specific queue,
  # in addition to the main hub Deployment.
  #
  # NOTE (type: standalone/microservice): the app chart creates hub worker queues
  # through rabbitmq.topology. Company-specific queues and bindings must be
  # created manually before deploying company workers.
  #
  # NOTE (type: mono): workers.mono.rabbitmq.companyFlows.enabled creates the
  # configured workers.mono.rabbitmq.flowExchange and binds company queues to it.
  companies: []
  # - name: molten-core           # used for K8s resource names
  #   namespace: ""               # deploys to a separate namespace (defaults to workers.namespace)
  #   queue: moltencore           # queue name to consume (defaults to name)
  #   replicaCount: 1             # standalone only; defaults to workers.replicaCount
  #   processes: 5                # standalone/microservice: numprocs in supervisord.conf (defaults to workers.processes / microservice processes)
  #   resources: {}               # defaults to workers.resources
  #   extraEnv: []
  #   extraEnvFrom: []
  #   podAnnotations: {}
  #   nodeSelector: {}
  #   tolerations: []
  #   affinity: {}
  #   processes: 5                # mono: defaults to workers.mono.processes

# ── RabbitMQ ───────────────────────────────────────────────────────────────────
# Set enabled: true to deploy RabbitMQ in-cluster. Set to false and populate
# external.* to use an existing RabbitMQ instance.
# RABBITMQ_HOST/PORT/USER/PASSWORD/VHOST are injected into app pods and monocore workers.
rabbitmq:
  namespace: ""  # overrides global namespace for RabbitMQ resources
  enabled: true
  topology:
    enabled: true
    command:
      - monocore
    args:
      - apply-rabbitmq-topology
      - --rabbitmq-topology-file=/etc/patchworks/rabbitmq/topology.yaml
    queueType: quorum
    backoffLimit: 3
    activeDeadlineSeconds: 300
  external:
    host: ""
    port: 5672
    username: patchworks
    password: ""
    vhost: /
    # Use an existing Secret for the RabbitMQ password when using an external instance.
    existingSecret:
      name: ""
      passwordKey: password
  image:
    repository: rabbitmq
    tag: 3-management-alpine
    pullPolicy: IfNotPresent
  auth:
    username: patchworks
    password: ""
    vhost: /
    # Use an existing Secret instead of the inline password value above.
    existingSecret:
      name: ""
      passwordKey: password
  persistence:
    existingClaim: ""
    accessModes: [ReadWriteOnce]
    size: 5Gi
    storageClass: ""
    spec: {}
  managementService:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

# ── KubeFaaS ──────────────────────────────────────────────────────────────────
# Set enabled: true to deploy KubeFaaS in-cluster (controller, builder, Redis,
# and function execution namespaces). Set to false and populate host/builderHost
# to connect workers to an existing KubeFaaS installation.
kubefaas:
  enabled: false
  # Namespace for the KubeFaaS control plane (controller, builder, Redis).
  # Defaults to "kubefaas" regardless of global/release namespace.
  namespace: kubefaas

  controller:
    image:
      repository: kubefaas-controller
      registry: quay.io/patchworks    # overrides global image.registry when set
      tag: v0.1.19         # overrides global image.tag when set
      pullPolicy: ""
    replicaCount: 3
    extraEnv: []
    resources:
      requests:
        cpu: 100m
        memory: 128Mi

  builder:
    image:
      repository: kubefaas-builder
      registry: quay.io/patchworks
      tag: v0.1.19
      pullPolicy: ""
    replicaCount: 1
    extraEnv: []
    # Registry name (from registries.yaml) used for base image operations.
    baseImagesRegistry: kubefaas-templates
    # S3 bucket used to cache compiled function images between builds.
    cacheBucket: kubefaas-cache
    # TLS configuration for the Docker-in-Docker sidecar.
    # mode: helm          — Helm generates self-signed certs; CA is preserved across upgrades via lookup.
    # mode: certManager   — cert-manager issues and rotates certs; requires cert-manager CRDs in the cluster.
    # mode: existingSecret — use pre-created Secrets; populate existingSecret below.
    tls:
      mode: helm
      # mode: certManager options.
      # Leave issuerName empty to auto-create a self-signed CA chain.
      # Set issuerName to use an existing Issuer or ClusterIssuer instead.
      certManager:
        issuerName: ""
        issuerKind: Issuer
        caDuration: 87600h
        caRenewBefore: 8760h
        duration: 8760h
        renewBefore: 720h
      # mode: existingSecret — names of pre-existing Secrets with ca.crt, tls.crt, tls.key.
      existingSecret:
        serverTls: ""
        clientTls: ""
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
    dind:
      resources:
        requests:
          cpu: 10m
          memory: 512Mi
        limits:
          memory: 2Gi

  # Credentials shared between controller, builder, and monocore workers.
  # When kubefaas.enabled and credentials.autoGenerate are true, missing values
  # are generated into a Secret by the infra chart.
  auth:
    enabled: true
    username: ""
    password: ""
    existingSecret:
      name: ""
      usernameKey: username
      passwordKey: password

  # Container registry where built function images are pushed.
  # config is the raw content of registries.yaml; use existingSecret to supply
  # it from a pre-created Secret instead.
  registry:
    name: default
    config: ""
    existingSecret:
      name: ""
      key: registries.yaml

  # Redis used by the controller and builder for function lifecycle tracking.
  # Set enabled: false and populate external.* to use an existing Redis.
  redis:
    enabled: true
    external:
      host: ""
      port: 6379
    image:
      repository: valkey/valkey
      tag: 8-alpine
      pullPolicy: IfNotPresent
    persistence:
      existingClaim: ""
      accessModes: [ReadWriteOnce]
      size: 1Gi
      storageClass: ""
      spec: {}
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 768Mi

  # Function execution namespace configuration.
  # The chart creates namespaceCount namespaces named <namespacePrefix>-NN,
  # each with a kubefaas-function ServiceAccount and a NetworkPolicy.
  functions:
    namespaceCount: 5
    namespacePrefix: kubefaas-fn
    # NetworkPolicy restricts function pod ingress/egress to only what kubefaas needs.
    # Disabled by default; enable in production to isolate function execution namespaces.
    networkPolicy:
      enabled: false
    profile:
      resources: |
        requests:
            cpu: 10m
            memory: 128M
        limits:
            cpu: ""
            memory: ""

  # Connection overrides — only used when enabled: false.
  # When enabled: true these are auto-derived from the in-cluster services.
  host: ""
  builderHost: ""

# ── Pusher / WebSocket ─────────────────────────────────────────────────────────
# When enabled, deploys an in-cluster Soketi WebSocket server and auto-wires
# PUSHER_HOST/PORT/SCHEME for all app pods and monocore config.yaml.
# When disabled, populate external.* to point at an external Pusher-compatible
# server (pusher.com, Soketi, Reverb, Sockudo, etc.).
# No PUSHER_* env vars are injected when neither enabled nor external.host is set
# and no credentials are provided.
pusher:
  enabled: true
  # App credentials. For in-cluster Soketi, omitted values are generated when
  # credentials.autoGenerate=true. Injected as PUSHER_APP_* env vars into app pods.
  appId: ""
  appKey: ""
  appSecret: ""
  appCluster: mt1
  # Use an existing Secret instead of the inline values above.
  existingSecret:
    name: ""
    appIdKey: app-id
    appKeyKey: app-key
    appSecretKey: app-secret
    appClusterKey: app-cluster
  # External Pusher-compatible server (used when enabled: false).
  # Leave host empty to use pusher.com (credentials above still apply).
  external:
    host: ""
    port: 443
    scheme: https
  ingress:
    enabled: false
    provider: contour
    className: ""
    annotations: {}
    host: ""
    tlsSecretName: ""
    timeout: 3600

# ── Ingress ────────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  # Ingress controller type. When set to contour, all configured public hosts
  # render as Contour HTTPProxy resources. nginx/other render standard Ingress
  # resources, with rewriteAnnotations used for dashboard path prefix stripping.
  #   contour  — renders Contour HTTPProxy resources (projectcontour.io/v1).
  #   nginx    — renders standard Ingress resources.
  #   other    — renders standard Ingress resources.
  provider: contour
  # Public URL scheme used when rendering dashboard/browser-facing URLs.
  # Set to "https" when TLS is terminated outside this chart.
  scheme: http
  className: ""
  annotations: {}
  # TLS secret names per service. When set, a TLS entry is added to that
  # service's Ingress (or HTTPProxy) using the hostname from ingress.hosts.*.
  # cert-manager will provision the cert automatically when the
  # cert-manager.io/cluster-issuer annotation is present in ingress.annotations.
  tls:
    gateway:
      secretName: ""
    start:
      secretName: ""
    webhook:
      secretName: ""
    callback:
      secretName: ""
    fabric:
      secretName: ""
    dashboard:
      secretName: ""
  # Hostname for each service. Leave empty to skip that service's ingress rule.
  # The dashboard host also serves /fabric, /core-main, and /core-start with
  # prefix stripping. The mechanism depends on ingress.provider.
  hosts:
    gateway: ""
    start: ""
    webhook: ""
    callback: ""
    fabric: ""
    dashboard: ""
  # Upstream response timeout (in seconds) applied to all routes.
  # The chart formats this for the chosen provider:
  #   contour → appended with "s" in timeoutPolicy.response and the
  #             projectcontour.io/response-timeout annotation.
  #   nginx   → used as-is for proxy-read-timeout / proxy-send-timeout.
  # Leave empty to use the controller default (typically 60 s).
  timeout: ""
  # Maximum request body size.
  # For nginx: sets nginx.ingress.kubernetes.io/proxy-body-size (default: 1m).
  # For Contour: not configurable at the HTTPProxy / Ingress level; ignored.
  maxBodySize: ""
  # Annotations added to the path-rewriting Ingress (nginx / other providers only).
  # Ignored when ingress.provider is contour.
  # For nginx-ingress:
  #   nginx.ingress.kubernetes.io/rewrite-target: /$2
  # (also set pathType to ImplementationSpecific and use regex paths e.g. /fabric(/|$)(.*))
  rewriteAnnotations: {}

# ── MySQL ──────────────────────────────────────────────────────────────────────
mysql:
  namespace: ""  # overrides global namespace for MySQL resources
  # Set to true to deploy MySQL in-cluster. Set to false and populate
  # external.* to use an existing MySQL instance.
  enabled: true
  external:
    host: ""
    port: 3306
    database: core
    username: patchworks
    password: ""
    # Use an existing Secret for the MySQL password when using an external instance.
    existingSecret:
      name: ""
      passwordKey: password
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  maxConnections: 1000
  auth:
    rootPassword: ""
    database: core
    username: patchworks
    password: ""
    # Use an existing Secret instead of the inline rootPassword/password values above.
    existingSecret:
      name: ""
      rootPasswordKey: root-password
      passwordKey: password
  persistence:
    existingClaim: ""
    accessModes: [ReadWriteOnce]
    size: 10Gi
    storageClass: ""
    spec: {}
  service:
    type: ClusterIP
  resources: {}

# ── Redis ──────────────────────────────────────────────────────────────────────
redis:
  namespace: ""  # overrides global namespace for Redis resources
  # Set to true to deploy Valkey (Redis-compatible) in-cluster. Set to false
  # and populate external.* to use an existing Redis/Valkey instance.
  enabled: true
  # Connection mode used by monocore's config.yaml.
  # For sentinel, set mode: sentinel, list addrs, and set sentinel.master.
  # Leave addrs empty to auto-derive from enabled/external settings.
  mode: standalone              # standalone | sentinel
  addrs: []                     # e.g. ["redis-sentinel:26379"]
  sentinel:
    master: mymaster
  db: 0
  external:
    host: ""
    port: 6379
    password: ""
    # Use an existing Secret for the Redis password when using an external instance.
    existingSecret:
      name: ""
      passwordKey: password
  image:
    repository: valkey/valkey
    tag: 8-alpine
    pullPolicy: IfNotPresent
  persistence:
    existingClaim: ""
    accessModes: [ReadWriteOnce]
    size: 1Gi
    storageClass: ""
    spec: {}
  service:
    type: ClusterIP
  resources: {}

# ── Elasticsearch ──────────────────────────────────────────────────────────────
elasticsearch:
  namespace: ""  # overrides global namespace for Elasticsearch resources
  # Set to true to deploy Elasticsearch in-cluster. Set to false and
  # populate external.* to use an existing Elasticsearch cluster.
  enabled: true
  auth:
    username: elastic
    password: ""
    existingSecret:
      name: ""
      usernameKey: username
      passwordKey: password
  external:
    host: ""
    port: 9200
    # Elastic Cloud ID. Self-hosted Elasticsearch does not normally provide this;
    # use host/port/scheme for self-hosted clusters.
    cloudId: ""
    cloudApiKey: ""
    apiKey: ""
    username: ""
    password: ""
    # Use an existing Secret for Elasticsearch credentials when using an external instance.
    existingSecret:
      name: ""
      cloudIdKey: ""
      cloudApiKeyKey: ""
      apiKeyKey: ""
      usernameKey: ELASTIC_SEARCH_USERNAME
      passwordKey: ELASTIC_SEARCH_PASSWORD
    scheme: http
  image:
    repository: elasticsearch
    tag: "8.15.0"
    pullPolicy: IfNotPresent
  persistence:
    existingClaim: ""
    accessModes: [ReadWriteOnce]
    size: 15Gi
    storageClass: ""
    spec: {}
  # Java heap size — keep to ~50% of the memory limit.
  javaOpts: "-Xms512m -Xmx512m"
  service:
    type: ClusterIP
  resources:
    requests:
      memory: 1Gi

# ── S3 / MinIO ─────────────────────────────────────────────────────────────────
# Set enabled: true to deploy a MinIO instance in-cluster. Set to false and
# populate external.* to use any S3-compatible object storage.
# When enabled, a post-install/post-upgrade Job creates the baseline bucket.
s3:
  namespace: ""  # overrides global namespace for S3/MinIO resources
  enabled: true
  external:
    endpoint: ""
    accessKey: ""
    secretKey: ""
    region: us-east-1
    bucket: patchworks
    pathStyle: false
    useSSL: "false"
    # Use an existing Secret for the S3 credentials when using an external instance.
    existingSecret:
      name: ""
      accessKeyKey: access-key
      secretKeyKey: secret-key
  image:
    repository: minio/minio
    tag: latest
    pullPolicy: IfNotPresent
  auth:
    rootUser: minioadmin
    rootPassword: ""
    # Use an existing Secret instead of the inline rootUser/rootPassword values above.
    existingSecret:
      name: ""
      rootUserKey: root-user
      rootPasswordKey: root-password
  bucket: patchworks
  # Default bucket for Core payloads when tenant-specific buckets are not available.
  payloadsBucket: ""
  # Bucket for tenant cache payloads; defaults to companyCacheBucket, then bucket above.
  tenantCacheBucket: ""
  # Bucket for file downloads; defaults to bucket above.
  fileDownloadsBucket: ""
  # Optional pwops-compatible endpoint for creating tenant-specific buckets.
  bucketCreationEndpoint: ""
  # Deprecated alias for monocore's customer_cache store; prefer tenantCacheBucket.
  companyCacheBucket: ""
  region: us-east-1
  persistence:
    existingClaim: ""
    accessModes: [ReadWriteOnce]
    size: 10Gi
    storageClass: ""
    spec: {}
  resources: {}

# ── S3 Manager (app chart passthrough) ─────────────────────────────────────────
# Bucket creation service deployed by the app chart. The infra chart keeps these
# values so one shared values file can be used for both charts; it does not render
# S3 Manager resources.
s3Manager:
  namespace: ""
  enabled: true
  external:
    # Use an externally managed bucket creation service instead of the app chart
    # managed in-cluster service. Takes precedence over enabled=true.
    endpoint: ""
  image:
    repository: s3manager
    registry: quay.io/patchworks
    tag: v0.1.19
    pullPolicy: ""
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  config:
    http:
      # Defaults to :<s3Manager.service.port> when empty.
      addr: ""
    log:
      format: json
    s3:
      # Defaults to minio for in-cluster S3, or aws for external S3.
      provider: ""
      # Defaults to the resolved chart S3 endpoint when empty.
      endpoint: ""
      # Defaults to the resolved chart S3 region when empty.
      region: ""
      sessionToken: ""
      # Defaults to the resolved chart S3 path-style setting when empty.
      pathStyle: ""
    buckets:
      name: "local-pwks-${company_id}.pwks.co"
      # Defaults to the resolved chart S3 region when empty.
      region: ""
      permissions:
        objectOwnership: BucketOwnerEnforced
      lifecycle:
        transitionDefaultMinimumObjectSize: varies_by_storage_class
        rules:
          expire-payloads:
            status: Enabled
            filterPrefix: payloads
            expirationDays: 4
            noncurrentVersionExpiration:
              noncurrentDays: 4
          expire-caches:
            status: Enabled
            filterPrefix: caches
            expirationDays: 8
            noncurrentVersionExpiration:
              noncurrentDays: 8
      metricFilterRules:
        AllObjects: {}
        Payloads:
          prefix: payloads
        Caches:
          prefix: caches
      tags:
        cost-center: core
        company: "${company_name}"
        environment: local
  extraEnv: []
  extraEnvFrom: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources: {}

# ── Soketi ─────────────────────────────────────────────────────────────────────
# Native in-cluster Pusher-compatible WebSocket server. Enabled via
# pusher.enabled and configured from pusher.* credentials.
soketi:
  fullnameOverride: patchworks-soketi
  replicaCount: 1
  image:
    repository: quay.io/soketi/soketi
    tag: "1.6-16-debian"
    pullPolicy: IfNotPresent
  command:
    - node
    - --max-old-space-size=256
    - --max_old_space_size=256
    - --optimize_for_size
    - --optimize-for-size
    - /app/bin/server.js
    - start
  mode: full
  service:
    type: ClusterIP
    port: 6001
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  podSecurityContext: {}
  terminationGracePeriodSeconds: 30
  # Opt into the upstream Soketi subchart instead of the native template.
  # When true, configure upstream values under this same soketi.* tree.
  subchart:
    enabled: false
