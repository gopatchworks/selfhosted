{{- if .Values.kubefaas.enabled }}
{{- $root := . }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $ns := include "patchworks.kubefaas.namespace" . }}
{{- $kf := .Values.kubefaas }}
{{- /* profile=lightweight: smaller requests from lightweight.kubefaas (patchworks.kubefaas.sizing). */}}
{{- $sizing := include "patchworks.kubefaas.sizing" . | fromYaml }}
{{- $redisHost := include "patchworks.kubefaas.redisHost" . }}
{{- $redisPort := include "patchworks.kubefaas.redisPort" . }}
{{- $authSecretName := include "patchworks.kubefaas.authSecretName" . }}
{{- $authUsernameKey := include "patchworks.kubefaas.authUsernameKey" . }}
{{- $authPasswordKey := include "patchworks.kubefaas.authPasswordKey" . }}
{{- $registrySecretName := include "patchworks.kubefaas.registrySecretName" . }}
{{- $registrySecretKey := include "patchworks.kubefaas.registrySecretKey" . }}

{{- /* The image cache's S3 login, copied here from its Secret in another namespace (patchworks.kubefaas.s3Login). */}}
{{- $s3Login := include "patchworks.kubefaas.s3Login" . | fromJson }}
{{- $s3SecretName := printf "%s-kubefaas-s3" $fullname }}
{{- if $s3Login.accessKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s3SecretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-builder
type: Opaque
data:
  access-key: {{ $s3Login.accessKey | b64enc }}
  secret-key: {{ $s3Login.secretKey | b64enc }}
{{- end }}

{{/* ── Docker TLS secret names — resolved per tls.mode. */}}
{{- $tlsMode := $kf.builder.tls.mode | default "helm" }}
{{- $serverTLSSecret := printf "%s-kubefaas-docker-server-tls" $fullname }}
{{- $clientTLSSecret := printf "%s-kubefaas-docker-client-tls" $fullname }}
{{- if eq $tlsMode "existingSecret" }}
{{- $serverTLSSecret = $kf.builder.tls.existingSecret.serverTls }}
{{- $clientTLSSecret = $kf.builder.tls.existingSecret.clientTls }}
{{- end }}

{{- /* kubefaas-registry.yaml renders registries.yaml for the bundled registry. */}}
{{- if and (not $kf.registry.existingSecret.name) (not (include "patchworks.kubefaas.registry.bundled" .)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $registrySecretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-builder
type: Opaque
data:
  registries.yaml: {{ $kf.registry.config | b64enc }}
{{- end }}

{{- if eq $tlsMode "helm" }}
{{/* Generate CA once (preserved via lookup), re-sign server/client on each render. */}}
{{- $caSecretName := printf "%s-kubefaas-docker-ca" $fullname }}
{{- $caSecret := lookup "v1" "Secret" $ns $caSecretName }}
{{- $ca := "" }}
{{- if and $caSecret $caSecret.data }}
{{- $ca = buildCustomCert (index $caSecret.data "cert") (index $caSecret.data "key") }}
{{- else }}
{{- $ca = genCA "kubefaas-docker-ca" 3650 }}
{{- end }}
{{- $serverCert := genSignedCert "docker-dind" (list "127.0.0.1") (list "localhost" "docker" "dind") 3650 $ca }}
{{- $clientCert := genSignedCert "docker-client" nil nil 3650 $ca }}
---
# Docker TLS CA — preserved across upgrades so existing signed certs remain valid.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $caSecretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-builder
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  cert: {{ $ca.Cert | b64enc }}
  key: {{ $ca.Key | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $serverTLSSecret }}
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-builder
type: Opaque
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $serverCert.Cert | b64enc }}
  tls.key: {{ $serverCert.Key | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $clientTLSSecret }}
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-builder
type: Opaque
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $clientCert.Cert | b64enc }}
  tls.key: {{ $clientCert.Key | b64enc }}
{{- end }}

{{- if eq $tlsMode "certManager" }}
{{- $cmIssuerName := $kf.builder.tls.certManager.issuerName }}
{{- $cmIssuerKind := $kf.builder.tls.certManager.issuerKind | default "Issuer" }}
{{- $cmCADuration := $kf.builder.tls.certManager.caDuration | default "87600h" }}
{{- $cmCARenewBefore := $kf.builder.tls.certManager.caRenewBefore | default "8760h" }}
{{- $cmDuration := $kf.builder.tls.certManager.duration | default "8760h" }}
{{- $cmRenewBefore := $kf.builder.tls.certManager.renewBefore | default "720h" }}
{{- if not $cmIssuerName }}
{{/* No issuer provided — create a self-signed CA chain. */}}
{{- $cmIssuerName = printf "%s-kubefaas-docker-ca-issuer" $fullname }}
{{- $cmIssuerKind = "Issuer" }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}-kubefaas-docker-selfsigned
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-builder
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}-kubefaas-docker-ca
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-builder
spec:
  isCA: true
  commonName: kubefaas-docker-ca
  secretName: {{ $fullname }}-kubefaas-docker-ca
  duration: {{ $cmCADuration }}
  renewBefore: {{ $cmCARenewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ $fullname }}-kubefaas-docker-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $cmIssuerName }}
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-builder
spec:
  ca:
    secretName: {{ $fullname }}-kubefaas-docker-ca
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}-kubefaas-docker-server
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-builder
spec:
  secretName: {{ $serverTLSSecret }}
  duration: {{ $cmDuration }}
  renewBefore: {{ $cmRenewBefore }}
  subject:
    organizations: [kubefaas]
  commonName: docker-dind
  dnsNames: [localhost, docker, dind]
  ipAddresses: ["127.0.0.1"]
  usages: [server auth, digital signature, key encipherment]
  issuerRef:
    name: {{ $cmIssuerName }}
    kind: {{ $cmIssuerKind }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}-kubefaas-docker-client
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-builder
spec:
  secretName: {{ $clientTLSSecret }}
  duration: {{ $cmDuration }}
  renewBefore: {{ $cmRenewBefore }}
  subject:
    organizations: [kubefaas]
  commonName: docker-client
  usages: [client auth, digital signature, key encipherment]
  issuerRef:
    name: {{ $cmIssuerName }}
    kind: {{ $cmIssuerKind }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-kubefaas-builder
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-builder
{{- with $root.Values.image.pullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-kubefaas-builder-env
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-builder
data:
  DOCKER_HOST: "tcp://127.0.0.1:2376"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: /certs/client
  REDIS_ENABLED: "true"
  REDIS_MODE: standalone
  REDIS_HOST: {{ $redisHost | quote }}
  REDIS_PORT: {{ $redisPort | quote }}
  REDIS_DATABASE: "0"
  AUTH_ENABLED: {{ $kf.auth.enabled | toString | quote }}
  BASE_IMAGES_REGISTRY: {{ $kf.builder.baseImagesRegistry | quote }}
  {{- with $kf.builder.platform }}
  BASE_IMAGE_PLATFORM: {{ . | quote }}
  {{- end }}
  {{- if $kf.builder.cacheBucket }}
  CACHE_S3_BUCKET: {{ $kf.builder.cacheBucket | quote }}
  AWS_REGION: {{ include "patchworks.s3.region" $root | quote }}
  {{- if $root.Values.s3.enabled }}
  AWS_S3_ENDPOINT: {{ include "patchworks.s3.endpoint" $root | quote }}
  AWS_S3_PATH_STYLE: "true"
  {{- end }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-kubefaas-builder
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-builder
spec:
  replicas: {{ $kf.builder.replicaCount }}
  revisionHistoryLimit: {{ $root.Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "patchworks.selectorLabels" (dict "component" "kubefaas-builder" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "kubefaas-builder" "Release" .Release) | nindent 8 }}
      annotations:
        checksum/config: {{ include "patchworks.kubefaas.configChecksum" . }}
        {{- if and $kf.auth.enabled (not $kf.auth.existingSecret.name) }}
        checksum/auth: {{ include "patchworks.kubefaas.authLogin" . | sha256sum }}
        {{- end }}
        {{- if include "patchworks.kubefaas.registry.bundled" . }}
        checksum/registry-login: {{ include "patchworks.kubefaas.registry.login" . | sha256sum }}
        {{- end }}
        {{- if $s3Login.accessKey }}
        checksum/s3-login: {{ printf "%s:%s" $s3Login.accessKey $s3Login.secretKey | sha256sum }}
        {{- end }}
    spec:
      {{- include "patchworks.podDnsConfig" (list .Values .Values.kubefaas .Values.kubefaas.builder) | nindent 6 }}
      serviceAccountName: {{ $fullname }}-kubefaas-builder
      {{- with $root.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: registries
          secret:
            secretName: {{ $registrySecretName }}
            items:
              - key: {{ $registrySecretKey }}
                path: registries.yaml
        - name: docker-server-certs-raw
          secret:
            secretName: {{ $serverTLSSecret }}
        - name: docker-client-certs-raw
          secret:
            secretName: {{ $clientTLSSecret }}
        - name: docker-server-certs
          emptyDir: {}
        - name: docker-client-certs
          emptyDir: {}
      initContainers:
        - name: wait-for-redis
          image: busybox:1.37
          command: [sh, -c, "until nc -zv -w 5 $REDIS_HOST $REDIS_PORT; do echo 'waiting for redis'; sleep 2; done"]
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-kubefaas-builder-env
        - name: setup-docker-certs
          image: busybox:1.37
          command: [sh, -c]
          args:
            - |
              cp /raw/server/ca.crt  /certs/server/ca.pem   &&
              cp /raw/server/tls.crt /certs/server/cert.pem &&
              cp /raw/server/tls.key /certs/server/key.pem  &&
              cp /raw/client/ca.crt  /certs/client/ca.pem   &&
              cp /raw/client/tls.crt /certs/client/cert.pem &&
              cp /raw/client/tls.key /certs/client/key.pem
          volumeMounts:
            - name: docker-server-certs-raw
              mountPath: /raw/server
              readOnly: true
            - name: docker-client-certs-raw
              mountPath: /raw/client
              readOnly: true
            - name: docker-server-certs
              mountPath: /certs/server
            - name: docker-client-certs
              mountPath: /certs/client
      containers:
        - name: kubefaas-builder
          image: {{ include "patchworks.appImage" (dict "svc" $kf.builder "root" $root) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" $kf.builder "root" $root) }}
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /v1/healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          # /v1/readyz fails until Docker answers and every template's base
          # image is in the registry, so the Service sends no builds before
          # then: a function build would fail on a missing base image. As in
          # the KubeFaaS chart (charts/kubefaas/templates/builder/deployment.yaml).
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /v1/healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-kubefaas-builder-env
          env:
            {{- if $kf.auth.enabled }}
            - name: AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecretName }}
                  key: {{ $authUsernameKey }}
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecretName }}
                  key: {{ $authPasswordKey }}
            {{- end }}
            {{- if $s3Login.accessKey }}
            - name: AWS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $s3SecretName }}
                  key: access-key
            - name: AWS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $s3SecretName }}
                  key: secret-key
            {{- else if $kf.builder.cacheBucket }}
            {{- /* Inline values, or the user's Secret by name, which must then exist in this namespace too. */}}
            {{- include "patchworks.env.s3AccessKey" $root | nindent 12 | replace "AWS_ACCESS_KEY_ID" "AWS_ACCESS_KEY" }}
            {{- include "patchworks.env.s3SecretKey" $root | nindent 12 | replace "AWS_SECRET_ACCESS_KEY" "AWS_SECRET_KEY" }}
            {{- end }}
            {{- with $kf.builder.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: registries
              mountPath: /app/config
            - name: docker-client-certs
              mountPath: /certs/client
              readOnly: true
          {{- with $sizing.builder }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if include "patchworks.kubefaas.registry.bundled" . }}
        {{- $proxy := $kf.registry.bundled.proxyImage }}
        # The bundled registry as localhost:<nodePort>, the name nodes pull it
        # by: Docker pushes to localhost over plain HTTP without configuration.
        - name: registry-proxy
          image: {{ $proxy.repository }}:{{ $proxy.tag }}
          imagePullPolicy: {{ $proxy.pullPolicy }}
          args:
            - {{ printf "TCP-LISTEN:%v,fork,reuseaddr,bind=127.0.0.1" $kf.registry.bundled.nodePort | quote }}
            - {{ printf "TCP:%s.%s.svc.cluster.local:5000" (include "patchworks.kubefaas.registry.name" .) $ns | quote }}
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
        {{- end }}
        - name: dind
          image: docker:27.0.1-dind
          command: [dockerd-entrypoint.sh]
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          ports:
            - name: docker-tls
              containerPort: 2376
          readinessProbe:
            exec:
              command: [docker, info]
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: docker-server-certs
              mountPath: /certs/server
              readOnly: true
            - name: docker-client-certs
              mountPath: /certs/client
              readOnly: true
          {{- with $sizing.dind }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-kubefaas-builder
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-builder
spec:
  type: ClusterIP
  selector:
    {{- include "patchworks.selectorLabels" (dict "component" "kubefaas-builder" "Release" .Release) | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- $basicAuth := dict }}
{{- if $kf.auth.enabled }}
{{- $basicAuth = dict "username" (dict "name" $authSecretName "key" $authUsernameKey) "password" (dict "name" $authSecretName "key" $authPasswordKey) }}
{{- end }}
{{ include "patchworks.serviceMonitor" (dict "root" $root "name" (printf "%s-kubefaas-builder" $fullname) "namespace" $ns "component" "kubefaas-builder" "port" "http" "options" $kf.builder.serviceMonitor "basicAuth" $basicAuth) }}
{{- end }}
