{{/*
Create configured schemas and grant the managed MySQL user access on install
and upgrade. Keep provisioning the Fabric schema when it shares this server.
*/}}
{{- $sharedFabric := and (not .Values.fabric.mysql.enabled) (empty .Values.fabric.mysql.external.host) }}
{{- $additional := .Values.mysql.databases | default list }}
{{- if and .Values.mysql.enabled (or $sharedFabric (not (empty $additional))) }}
{{- if not (kindIs "slice" $additional) }}
{{- fail "mysql.databases must be a list of database names" }}
{{- end }}
{{- $databases := concat (list .Values.mysql.auth.database) $additional }}
{{- if $sharedFabric }}
{{- $databases = append $databases .Values.fabric.mysql.database }}
{{- end }}
{{- $username := include "patchworks.mysql.setupUsername" . }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $ns := include "patchworks.mysql.namespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-mysql-setup
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql-setup
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "mysql-setup" "Release" .Release) | nindent 8 }}
    spec:
      {{- include "patchworks.podDnsConfig" (list .Values .Values.mysql) | nindent 6 }}
      restartPolicy: Never
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0
          command:
            - sh
            - -euc
            - |
              echo "Waiting for MySQL..."
              until mysqladmin ping -h {{ include "patchworks.mysql.host" . }} -P {{ include "patchworks.mysql.port" . }} --silent; do sleep 2; done
              echo "MySQL ready."
      containers:
        - name: mysql-setup
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          command:
            - sh
            - -euc
            - |
              mysql -h {{ include "patchworks.mysql.host" . }} -P {{ include "patchworks.mysql.port" . }} \
                -uroot -p"${MYSQL_ROOT_PASSWORD}" <<'SQL'
              SET SESSION sql_mode = 'NO_BACKSLASH_ESCAPES';
              {{- range $database := uniq $databases }}
              {{- $name := include "patchworks.mysql.setupDatabase" $database }}
              CREATE DATABASE IF NOT EXISTS `{{ $name }}`;
              GRANT ALL PRIVILEGES ON `{{ $name | replace "_" "\\_" }}`.* TO '{{ $username }}'@'%';
              {{- end }}
              FLUSH PRIVILEGES;
              SQL
              echo "Managed MySQL databases ready."
          env:
            {{- $es := fromJson (include "patchworks.mysql.existingSecret" .) }}
            {{- include "patchworks.secretEnv" (dict "name" "MYSQL_ROOT_PASSWORD" "value" .Values.mysql.auth.rootPassword "secret" (dict "name" $es.name "key" $es.rootPasswordKey)) | nindent 12 }}
{{- end }}
