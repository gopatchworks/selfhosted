{{- if .Values.rabbitmq.enabled }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $ns := include "patchworks.rabbitmq.namespace" . }}
{{- $rmq := .Values.rabbitmq }}
{{- $p := $rmq.persistence }}
{{- if not $p.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-rabbitmq
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  {{- include "patchworks.pvcSpec" $p | nindent 2 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-rabbitmq
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "patchworks.selectorLabels" (dict "component" "rabbitmq" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "rabbitmq" "Release" .Release) | nindent 8 }}
    spec:
      containers:
        - name: rabbitmq
          image: {{ $rmq.image.repository }}:{{ $rmq.image.tag }}
          imagePullPolicy: {{ $rmq.image.pullPolicy }}
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: {{ $rmq.auth.username | quote }}
            {{- $secret := fromJson (include "patchworks.rabbitmq.passwordSecret" .) }}
            {{- include "patchworks.secretEnv" (dict "name" "RABBITMQ_DEFAULT_PASS" "value" $rmq.auth.password "secret" $secret) | nindent 12 }}
            {{- if and $rmq.auth.vhost (ne $rmq.auth.vhost "/") }}
            - name: RABBITMQ_DEFAULT_VHOST
              value: {{ $rmq.auth.vhost | quote }}
            {{- end }}
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          {{- with $rmq.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $p.existingClaim | default (printf "%s-rabbitmq" $fullname) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-rabbitmq
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  type: ClusterIP
  selector:
    {{- include "patchworks.selectorLabels" (dict "component" "rabbitmq" "Release" .Release) | nindent 4 }}
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-rabbitmq-management
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  type: {{ $rmq.managementService.type }}
  selector:
    {{- include "patchworks.selectorLabels" (dict "component" "rabbitmq" "Release" .Release) | nindent 4 }}
  ports:
    - name: management
      port: 15672
      targetPort: management
{{- end }}
