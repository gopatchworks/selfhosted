{{- if .Values.rabbitmq.enabled }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $ns := include "patchworks.rabbitmq.namespace" . }}
{{- $rmq := .Values.rabbitmq }}
{{- $p := $rmq.persistence }}
{{- /* profile=lightweight: lightweight.rabbitmq.resources over rabbitmq.resources. */}}
{{- $resources := $rmq.resources }}
{{- with include "patchworks.lightweight.resources" (dict "root" . "name" "rabbitmq" "shared" $rmq.resources) }}
{{- $resources = fromYaml . }}
{{- end }}
{{- if $rmq.metrics.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-rabbitmq-plugins
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
data:
  enabled_plugins: "[rabbitmq_management,rabbitmq_prometheus]."
{{- end }}
{{- if not $p.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-rabbitmq
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  {{- include "patchworks.pvcSpec" $p | nindent 2 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-rabbitmq
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  # On a rollout, stop the old broker before starting the new one: both would
  # open the same volume and node data dir. The container's lock covers a
  # deleted or evicted pod, whose replacement starts at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "patchworks.selectorLabels" (dict "component" "rabbitmq" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "rabbitmq" "Release" .Release) | nindent 8 }}
    spec:
      # RabbitMQ names its node rabbit@<hostname> and keeps its data in
      # /var/lib/rabbitmq/mnesia/rabbit@<hostname>. Left to the pod name, the
      # hostname changed on every rollout and the new pod started an empty
      # broker. RABBITMQ_NODENAME alone doesn't work: the broker and the probes
      # must resolve its host part, and the pod resolves only its own hostname.
      hostname: {{ $rmq.hostname | default (printf "%s-rabbitmq" $fullname) }}
      {{- include "patchworks.podDnsConfig" (list .Values .Values.rabbitmq) | nindent 6 }}
      containers:
        - name: rabbitmq
          image: {{ $rmq.image.repository }}:{{ $rmq.image.tag }}
          imagePullPolicy: {{ $rmq.image.pullPolicy }}
          # The ReplicaSet replaces a deleted or evicted pod while it is still
          # stopping, and on the same node both pods mount the volume. A lock
          # on the volume, held by rabbitmq-server through the inherited fd
          # and released when the old container exits, makes the new broker
          # wait rather than open the same node data dir. Storage without
          # flock starts at once, as before. The rest is the image's own
          # entrypoint and command.
          command:
            - sh
            - -c
            - |
              exec 9>>/var/lib/rabbitmq/.broker.lock
              if ! flock -n 9; then
                echo "Waiting for the previous RabbitMQ pod to stop."
                flock 9 || echo "Could not lock /var/lib/rabbitmq/.broker.lock; starting anyway."
              fi
              exec docker-entrypoint.sh rabbitmq-server
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            {{- if $rmq.metrics.enabled }}
            - name: metrics
              containerPort: 15692
            {{- end }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: {{ $rmq.auth.username | quote }}
            {{- $secret := fromJson (include "patchworks.rabbitmq.passwordSecret" .) }}
            {{- include "patchworks.secretEnv" (dict "name" "RABBITMQ_DEFAULT_PASS" "value" $rmq.auth.password "secret" $secret) | nindent 12 }}
            {{- if and $rmq.auth.vhost (ne $rmq.auth.vhost "/") }}
            - name: RABBITMQ_DEFAULT_VHOST
              value: {{ $rmq.auth.vhost | quote }}
            {{- end }}
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            {{- if $rmq.metrics.enabled }}
            - name: plugins
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
              readOnly: true
            {{- end }}
          {{- with $resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if $rmq.metrics.enabled }}
        - name: plugins
          configMap:
            name: {{ $fullname }}-rabbitmq-plugins
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $p.existingClaim | default (printf "%s-rabbitmq" $fullname) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-rabbitmq
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  type: ClusterIP
  selector:
    {{- include "patchworks.selectorLabels" (dict "component" "rabbitmq" "Release" .Release) | nindent 4 }}
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-rabbitmq-management
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  type: {{ $rmq.managementService.type }}
  selector:
    {{- include "patchworks.selectorLabels" (dict "component" "rabbitmq" "Release" .Release) | nindent 4 }}
  ports:
    - name: management
      port: 15672
      targetPort: management

{{- if $rmq.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-rabbitmq-metrics
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq-metrics
spec:
  type: ClusterIP
  selector:
    {{- include "patchworks.selectorLabels" (dict "component" "rabbitmq" "Release" .Release) | nindent 4 }}
  ports:
    - name: metrics
      port: 15692
      targetPort: metrics
{{ include "patchworks.serviceMonitor" (dict "root" . "name" (printf "%s-rabbitmq" $fullname) "namespace" $ns "component" "rabbitmq-metrics" "port" "metrics" "options" $rmq.metrics.serviceMonitor) }}
{{- end }}
{{- end }}
