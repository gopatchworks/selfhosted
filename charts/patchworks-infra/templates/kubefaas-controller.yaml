{{- if .Values.kubefaas.enabled }}
{{- $root := . }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $ns := include "patchworks.kubefaas.namespace" . }}
{{- $kf := .Values.kubefaas }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
{{- $redisHost := include "patchworks.kubefaas.redisHost" . }}
{{- $redisPort := include "patchworks.kubefaas.redisPort" . }}
{{- $authSecretName := include "patchworks.kubefaas.authSecretName" . }}
{{- $authUsernameKey := include "patchworks.kubefaas.authUsernameKey" . }}
{{- $authPasswordKey := include "patchworks.kubefaas.authPasswordKey" . }}
{{- if and $kf.auth.enabled (not $kf.auth.existingSecret.name) (not (and .Values.credentials.autoGenerate (or (not $kf.auth.username) (not $kf.auth.password)))) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $authSecretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-controller
type: Opaque
data:
  username: {{ $kf.auth.username | b64enc }}
  password: {{ $kf.auth.password | b64enc }}
{{- if ne $ns .Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $authSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-auth
type: Opaque
data:
  username: {{ $kf.auth.username | b64enc }}
  password: {{ $kf.auth.password | b64enc }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-kubefaas-controller
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-controller
{{- with $root.Values.image.pullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-kubefaas-controller
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-controller
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, endpoints, events, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [discovery, discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-kubefaas-controller
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-kubefaas-controller
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-kubefaas-controller
    namespace: {{ $ns }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-kubefaas-controller-env
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-controller
data:
  APP_NAME: kubefaas
  FUNCTION_PROFILE_NAMESPACE: {{ $ns | quote }}
  FUNCTION_SERVICE_ACCOUNT: kubefaas-function
  FUNCTION_PULL_POLICY: IfNotPresent
  FUNCTION_NAMESPACE_MAX: {{ $kf.functions.namespaceCount | quote }}
  FUNCTION_NAMESPACE_MAX_FUNCTIONS: "2000"
  REDIS_ENABLED: "true"
  REDIS_MODE: standalone
  REDIS_HOST: {{ $redisHost | quote }}
  REDIS_PORT: {{ $redisPort | quote }}
  REDIS_DATABASE: "0"
  AUTH_ENABLED: {{ $kf.auth.enabled | toString | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-kubefaas-controller
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-controller
spec:
  replicas: {{ $kf.controller.replicaCount }}
  revisionHistoryLimit: {{ $root.Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "patchworks.selectorLabels" (dict "component" "kubefaas-controller" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "kubefaas-controller" "Release" .Release) | nindent 8 }}
      annotations:
        checksum/config: {{ $kf | toJson | sha256sum }}
    spec:
      serviceAccountName: {{ $fullname }}-kubefaas-controller
      {{- with $root.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-redis
          image: busybox:1.37
          command: [sh, -c, "until nc -zv -w 5 $REDIS_HOST $REDIS_PORT; do echo 'waiting for redis'; sleep 2; done"]
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-kubefaas-controller-env
      containers:
        - name: kubefaas-controller
          image: {{ include "patchworks.appImage" (dict "svc" $kf.controller "root" $root) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" $kf.controller "root" $root) }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-kubefaas-controller-env
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if $kf.auth.enabled }}
            - name: AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecretName }}
                  key: {{ $authUsernameKey }}
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecretName }}
                  key: {{ $authPasswordKey }}
            {{- end }}
            {{- with $kf.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $kf.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-kubefaas-controller
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubefaas-controller
spec:
  type: ClusterIP
  selector:
    {{- include "patchworks.selectorLabels" (dict "component" "kubefaas-controller" "Release" .Release) | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
