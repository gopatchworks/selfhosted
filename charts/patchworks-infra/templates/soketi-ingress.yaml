{{- if and .Values.pusher.enabled .Values.pusher.ingress.enabled .Values.pusher.ingress.host }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $serviceName := printf "%s-soketi" $fullname }}
{{- $provider := .Values.pusher.ingress.provider | default "" }}
{{- $timeout := .Values.pusher.ingress.timeout | default 3600 }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: soketi
  annotations:
    {{- if eq $provider "contour" }}
    projectcontour.io/websocket-routes: /app
    {{- end }}
    {{- if eq $provider "nginx" }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ $timeout | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ $timeout | quote }}
    {{- end }}
    {{- with .Values.pusher.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.pusher.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.pusher.ingress.tlsSecretName }}
  tls:
    - secretName: {{ .Values.pusher.ingress.tlsSecretName }}
      hosts:
        - {{ .Values.pusher.ingress.host }}
  {{- end }}
  rules:
    - host: {{ .Values.pusher.ingress.host }}
      http:
        paths:
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: {{ $serviceName }}
                port:
                  number: {{ .Values.soketi.service.port }}
{{- end }}
