{{- if .Values.credentials.autoGenerate }}
{{- $fullname := include "patchworks.fullname" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-credential-generator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-generator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-delete-policy": HookSucceeded
    "argocd.argoproj.io/sync-wave": "-30"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-credential-generator
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-generator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-delete-policy": HookSucceeded
    "argocd.argoproj.io/sync-wave": "-30"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-credential-generator
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-generator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-delete-policy": HookSucceeded
    "argocd.argoproj.io/sync-wave": "-30"
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-credential-generator
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-credential-generator
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-credential-generator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-generator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-delete-policy": HookSucceeded
    "argocd.argoproj.io/sync-wave": "-20"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "credential-generator" "Release" .Release) | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $fullname }}-credential-generator
      containers:
        - name: kubectl
          image: "{{ .Values.credentials.generator.image.repository }}:{{ .Values.credentials.generator.image.tag }}"
          imagePullPolicy: {{ .Values.credentials.generator.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu

              random_value() {
                head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32
              }

              ensure_secret() {
                ns="$1"
                name="$2"
                shift 2

                if kubectl -n "$ns" get secret "$name" >/dev/null 2>&1; then
                  echo "Secret ${ns}/${name} already exists."
                  return
                fi

                echo "Creating Secret ${ns}/${name}."
                kubectl -n "$ns" create secret generic "$name" "$@"
              }

              {{- if and .Values.mysql.enabled (not .Values.mysql.auth.existingSecret.name) (or (not .Values.mysql.auth.rootPassword) (not .Values.mysql.auth.password)) }}
              mysql_root={{ .Values.mysql.auth.rootPassword | quote }}
              mysql_password={{ .Values.mysql.auth.password | quote }}
              [ -n "$mysql_root" ] || mysql_root="$(random_value)"
              [ -n "$mysql_password" ] || mysql_password="$(random_value)"
              ensure_secret {{ include "patchworks.mysql.namespace" . | quote }} {{ printf "%s-mysql-auth" $fullname | quote }} \
                "--from-literal={{ .Values.mysql.auth.existingSecret.rootPasswordKey }}=${mysql_root}" \
                "--from-literal={{ .Values.mysql.auth.existingSecret.passwordKey }}=${mysql_password}"
              {{- end }}

              {{- if and .Values.fabric.mysql.enabled (not .Values.fabric.mysql.auth.existingSecret.name) (or (not .Values.fabric.mysql.auth.rootPassword) (not .Values.fabric.mysql.auth.password)) }}
              fabric_mysql_root={{ .Values.fabric.mysql.auth.rootPassword | quote }}
              fabric_mysql_password={{ .Values.fabric.mysql.auth.password | quote }}
              [ -n "$fabric_mysql_root" ] || fabric_mysql_root="$(random_value)"
              [ -n "$fabric_mysql_password" ] || fabric_mysql_password="$(random_value)"
              ensure_secret {{ include "patchworks.fabric.namespace" . | quote }} {{ printf "%s-fabric-mysql-auth" $fullname | quote }} \
                "--from-literal={{ .Values.fabric.mysql.auth.existingSecret.rootPasswordKey }}=${fabric_mysql_root}" \
                "--from-literal={{ .Values.fabric.mysql.auth.existingSecret.passwordKey }}=${fabric_mysql_password}"
              {{- end }}

              {{- if and .Values.rabbitmq.enabled (not .Values.rabbitmq.auth.existingSecret.name) (not .Values.rabbitmq.auth.password) }}
              rabbitmq_password="$(random_value)"
              ensure_secret {{ include "patchworks.rabbitmq.namespace" . | quote }} {{ printf "%s-rabbitmq-auth" $fullname | quote }} \
                "--from-literal={{ .Values.rabbitmq.auth.existingSecret.passwordKey }}=${rabbitmq_password}"
              {{- end }}

              {{- if and .Values.elasticsearch.enabled (not .Values.elasticsearch.auth.existingSecret.name) (not .Values.elasticsearch.auth.password) }}
              elasticsearch_password="$(random_value)"
              ensure_secret {{ include "patchworks.elasticsearch.namespace" . | quote }} {{ printf "%s-elasticsearch-auth" $fullname | quote }} \
                "--from-literal={{ .Values.elasticsearch.auth.existingSecret.usernameKey }}={{ .Values.elasticsearch.auth.username }}" \
                "--from-literal={{ .Values.elasticsearch.auth.existingSecret.passwordKey }}=${elasticsearch_password}"
              {{- end }}

              {{- if and .Values.s3.enabled (not .Values.s3.auth.existingSecret.name) (or (not .Values.s3.auth.rootUser) (not .Values.s3.auth.rootPassword)) }}
              s3_root_user={{ .Values.s3.auth.rootUser | quote }}
              s3_root_password={{ .Values.s3.auth.rootPassword | quote }}
              [ -n "$s3_root_user" ] || s3_root_user="$(random_value)"
              [ -n "$s3_root_password" ] || s3_root_password="$(random_value)"
              ensure_secret {{ include "patchworks.s3.namespace" . | quote }} {{ printf "%s-s3-auth" $fullname | quote }} \
                "--from-literal={{ .Values.s3.auth.existingSecret.rootUserKey }}=${s3_root_user}" \
                "--from-literal={{ .Values.s3.auth.existingSecret.rootPasswordKey }}=${s3_root_password}"
              {{- end }}

              {{- if and .Values.pusher.enabled (not .Values.pusher.existingSecret.name) (or (not .Values.pusher.appId) (not .Values.pusher.appKey) (not .Values.pusher.appSecret)) }}
              pusher_app_id={{ .Values.pusher.appId | quote }}
              pusher_app_key={{ .Values.pusher.appKey | quote }}
              pusher_app_secret={{ .Values.pusher.appSecret | quote }}
              pusher_app_cluster={{ .Values.pusher.appCluster | quote }}
              [ -n "$pusher_app_id" ] || pusher_app_id="$(random_value)"
              [ -n "$pusher_app_key" ] || pusher_app_key="$(random_value)"
              [ -n "$pusher_app_secret" ] || pusher_app_secret="$(random_value)"
              [ -n "$pusher_app_cluster" ] || pusher_app_cluster="mt1"
              ensure_secret {{ .Release.Namespace | quote }} {{ printf "%s-soketi-auth" $fullname | quote }} \
                "--from-literal={{ .Values.pusher.existingSecret.appIdKey | default "app-id" }}=${pusher_app_id}" \
                "--from-literal={{ .Values.pusher.existingSecret.appKeyKey | default "app-key" }}=${pusher_app_key}" \
                "--from-literal={{ .Values.pusher.existingSecret.appSecretKey | default "app-secret" }}=${pusher_app_secret}" \
                "--from-literal={{ .Values.pusher.existingSecret.appClusterKey | default "app-cluster" }}=${pusher_app_cluster}"
              {{- end }}

              {{- if and .Values.kubefaas.enabled .Values.kubefaas.auth.enabled (not .Values.kubefaas.auth.existingSecret.name) (or (not .Values.kubefaas.auth.username) (not .Values.kubefaas.auth.password)) }}
              kubefaas_username={{ .Values.kubefaas.auth.username | quote }}
              kubefaas_password={{ .Values.kubefaas.auth.password | quote }}
              [ -n "$kubefaas_username" ] || kubefaas_username="$(random_value)"
              [ -n "$kubefaas_password" ] || kubefaas_password="$(random_value)"
              ensure_secret {{ include "patchworks.kubefaas.namespace" . | quote }} {{ include "patchworks.kubefaas.authSecretName" . | quote }} \
                "--from-literal={{ include "patchworks.kubefaas.authUsernameKey" . }}=${kubefaas_username}" \
                "--from-literal={{ include "patchworks.kubefaas.authPasswordKey" . }}=${kubefaas_password}"
              {{- if ne (include "patchworks.kubefaas.namespace" .) .Release.Namespace }}
              ensure_secret {{ .Release.Namespace | quote }} {{ include "patchworks.kubefaas.authSecretName" . | quote }} \
                "--from-literal={{ include "patchworks.kubefaas.authUsernameKey" . }}=${kubefaas_username}" \
                "--from-literal={{ include "patchworks.kubefaas.authPasswordKey" . }}=${kubefaas_password}"
              {{- end }}
              {{- end }}

              echo "Credential generation complete."
{{- end }}
