                      format: int32
                      minimum: 1
                    maxReplicas:
                      type: integer
                      format: int32
                      minimum: 1
                    targetCPUUtilizationPercentage:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 100
                    shutdownAfterInactive:
                      type: string
                    maxConcurrentInvocations:
                      type: integer
                      format: int32
                      minimum: 0
                    drain:
                      type: object
                      properties:
                        preStopSeconds:
                          type: integer
                          format: int32
                          minimum: 0
                        terminationGracePeriodSeconds:
                          type: integer
                          format: int64
                          minimum: 0
                    disruptionBudget:
                      type: object
                      properties:
                        maxUnavailable:
                          x-kubernetes-int-or-string: true
                        minAvailable:
