# Install KEDA first. Create this Secret in each worker namespace.
# Keys username/password authenticate to the management endpoint.
workers:
  autoscaling:
    enabled: true
    provider: keda
    minReplicas: 1
    maxReplicas: 10
    keda:
      rabbitmq:
        enabled: true
        host: https://rabbitmq.example.com:15671/
        protocol: http
        vhostName: /
        existingSecret:
          name: rabbitmq-scaler
        # The default trigger scales against estimated drain time, including
        # queued and unacknowledged messages. It requires pollingInterval: 1.
        expectedQueueConsumptionTime:
          value: "10"
          activationValue: "1"
