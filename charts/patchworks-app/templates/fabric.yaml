---
# ConfigMap — default Nginx config proxying to PHP-FPM on localhost:9000.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "patchworks.fullname" . }}-fabric-nginx
  namespace: {{ include "patchworks.fabric.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: fabric
data:
  site.conf: |
    {{- .Files.Get "files/fabric-nginx.conf" | nindent 4 }}
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "patchworks.fullname" . }}-fabric
  namespace: {{ include "patchworks.fabric.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: fabric
  {{- with .Values.fabric.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.fabric.replicaCount }}
  selector:
    matchLabels:
      {{- include "patchworks.selectorLabels" (dict "component" "fabric" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "fabric" "Release" .Release) | nindent 8 }}
      annotations:
        checksum/config: {{ include "patchworks.fabricConfigData" . | sha256sum }}
        checksum/nginx: {{ .Files.Get "files/fabric-nginx.conf" | sha256sum }}
        {{- with .Values.fabric.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "patchworks.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "patchworks.fullname" . }}-fabric-nginx
            items:
              - key: site.conf
                path: site.conf
      initContainers:
        - name: fabric-init
          image: {{ include "patchworks.appImage" (dict "svc" .Values.fabric "root" .) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" .Values.fabric "root" .) }}
          command: ["/bin/sh", "-c", {{ .Values.fabric.init.command | quote }}]
          envFrom:
            - configMapRef:
                name: {{ include "patchworks.fullname" . }}-fabric-config
            - secretRef:
                name: {{ include "patchworks.fullname" . }}-fabric-secret
            - secretRef:
                name: {{ include "patchworks.passportSecretName" . }}
            {{- with (concat .Values.app.extraEnvFrom .Values.fabric.extraEnvFrom) }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "patchworks.fabricSecretEnvRefs" . | nindent 12 }}
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.fabric.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      containers:
        - name: fabric
          image: {{ include "patchworks.appImage" (dict "svc" .Values.fabric "root" .) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" .Values.fabric "root" .) }}
          ports:
            - name: fpm
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: {{ include "patchworks.fullname" . }}-fabric-config
            - secretRef:
                name: {{ include "patchworks.fullname" . }}-fabric-secret
            - secretRef:
                name: {{ include "patchworks.passportSecretName" . }}
            {{- with (concat .Values.app.extraEnvFrom .Values.fabric.extraEnvFrom) }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "patchworks.fabricRuntimeEnv" . | nindent 12 }}
            {{- include "patchworks.fabricSecretEnvRefs" . | nindent 12 }}
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.fabric.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.fabric.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: fabric-nginx
          image: nginx:stable-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      {{- with .Values.fabric.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.fabric.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.fabric.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "patchworks.fullname" . }}-fabric
  namespace: {{ include "patchworks.fabric.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: fabric
spec:
  type: {{ .Values.fabric.service.type }}
  selector:
    {{- include "patchworks.selectorLabels" (dict "component" "fabric" "Release" .Release) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.fabric.service.port }}
      targetPort: http
