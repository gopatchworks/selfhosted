{{- include "patchworks.validate" . -}}
{{- /* mergeOverwrite(parent, child): child keys always win including zeros/false/empty */ -}}
{{- $svc := mergeOverwrite (deepCopy .Values.web) .Values.web.gateway -}}
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "patchworks.fullname" . }}-gateway
  namespace: {{ include "patchworks.gateway.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with $svc.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      {{- include "patchworks.selectorLabels" (dict "component" "gateway" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "gateway" "Release" .Release) | nindent 8 }}
      annotations:
        checksum/config: {{ include "patchworks.appConfigData" . | sha256sum }}
        {{- with $svc.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "patchworks.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "patchworks.waitForDeps" . | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "patchworks.appImage" (dict "svc" $svc "root" .) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" $svc "root" .) }}
          command: ["/usr/local/bin/php"]
          args: ["artisan", "octane:start", "--server=roadrunner", "--host=0.0.0.0", "--rpc-port=6001", "--port=80"]
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: {{ include "patchworks.fullname" . }}-config
            - secretRef:
                name: {{ include "patchworks.fullname" . }}-secret
            - secretRef:
                name: {{ include "patchworks.passportSecretName" . }}
            {{- with (concat .Values.app.extraEnvFrom $svc.extraEnvFrom) }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "patchworks.appSecretEnvRefs" . | nindent 12 }}
            - name: APP_DOMAIN
              value: gateway
            - name: RABBITMQ_QUEUE
              value: {{ $svc.queue | quote }}
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $svc.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 80
              httpHeaders:
                - name: Content-Type
                  value: application/json
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 80
              httpHeaders:
                - name: Content-Type
                  value: application/json
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $svc.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "patchworks.fullname" . }}-gateway
  namespace: {{ include "patchworks.gateway.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ $svc.service.type }}
  selector:
    {{- include "patchworks.selectorLabels" (dict "component" "gateway" "Release" .Release) | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.service.port }}
      targetPort: http
