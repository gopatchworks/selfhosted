{{- $root := . }}
{{- range $namespace, $_ := (include "patchworks.consumerNamespaces" . | fromJson).serviceAccounts }}
{{- with $root }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "patchworks.serviceAccountName" . }}
  namespace: {{ $namespace }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.image.pullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}

{{- end }}
{{- end }}
