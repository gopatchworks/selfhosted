{{- if .Values.dashboard.enabled }}
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "patchworks.fullname" . }}-dashboard
  namespace: {{ include "patchworks.dashboard.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  {{- with .Values.dashboard.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "patchworks.selectorLabels" (dict "component" "dashboard" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "dashboard" "Release" .Release) | nindent 8 }}
      annotations:
        checksum/config: {{ include "patchworks.dashboardConfigJs" . | sha256sum }}
        {{- with .Values.dashboard.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "patchworks.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: dashboard-config
          image: {{ include "patchworks.appImage" (dict "svc" .Values.dashboard "root" .) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" .Values.dashboard "root" .) }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              cat > /dashboard-config/config.js <<'EOF'
              {{- include "patchworks.dashboardConfigJs" . | nindent 14 }}
              EOF

              escape_sed() {
                printf '%s' "$1" | sed 's/[\/&|]/\\&/g'
              }

              pusher_app_key="$(escape_sed "${DASHBOARD_PUSHER_APP_KEY:-}")"
              pusher_app_cluster="$(escape_sed "${DASHBOARD_PUSHER_APP_CLUSTER:-mt1}")"
              sed -i \
                -e "s|__DASHBOARD_PUSHER_APP_KEY__|${pusher_app_key}|g" \
                -e "s|__DASHBOARD_PUSHER_APP_CLUSTER__|${pusher_app_cluster}|g" \
                /dashboard-config/config.js
          env:
            {{- include "patchworks.dashboardPusherConfigEnv" . | nindent 12 }}
          volumeMounts:
            - name: dashboard-config
              mountPath: /dashboard-config
      containers:
        - name: dashboard
          image: {{ include "patchworks.appImage" (dict "svc" .Values.dashboard "root" .) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" .Values.dashboard "root" .) }}
          ports:
            - name: http
              containerPort: 80
          {{- if .Values.dashboard.extraEnv }}
          env:
            {{- with .Values.dashboard.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: dashboard-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.dashboard.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: dashboard-config
          emptyDir: {}
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "patchworks.fullname" . }}-dashboard
  namespace: {{ include "patchworks.dashboard.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  selector:
    {{- include "patchworks.selectorLabels" (dict "component" "dashboard" "Release" .Release) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
{{- end }}
