{{- if .Values.seeds.fabric.enabled }}
---
# Job — Fabric first-install seeder (runs before the Fabric company seeder,
# Core migrations, Core seeders, and app pods).
# Passport keys must already exist (generated by pre-install keygen job).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "patchworks.fullname" . }}-fabric-seeds
  namespace: {{ include "patchworks.fabric.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: fabric-seeds
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-2"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: {{ .Values.seeds.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "fabric-seeds" "Release" .Release) | nindent 8 }}
    spec:
      restartPolicy: {{ .Values.seeds.restartPolicy }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for Fabric MySQL..."
              until mysqladmin ping -h {{ include "patchworks.fabric.mysql.host" . }} -P {{ include "patchworks.fabric.mysql.port" . }} --silent; do sleep 2; done
              echo "Fabric MySQL ready."
      containers:
        {{- $fabricSeedSvc := merge (deepCopy .Values.seeds.fabric) .Values.fabric }}
        - name: fabric-seeds
          image: {{ include "patchworks.appImage" (dict "svc" $fabricSeedSvc "root" .) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" $fabricSeedSvc "root" .) }}
          command:
            - /bin/sh
            - -c
            - {{ .Values.seeds.fabric.command | quote }}
          envFrom:
            - secretRef:
                name: {{ include "patchworks.passportSecretName" . }}
            {{- with (concat .Values.app.extraEnvFrom .Values.fabric.extraEnvFrom) }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "patchworks.fabricEnv" . | nindent 12 }}
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.fabric.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.seeds.fabric.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.seeds.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.seeds.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.seeds.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.seeds.fabric.enabled }}
---
# Job — creates the initial Fabric company and admin user after Fabric
# migrations and seeders have completed.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "patchworks.fullname" . }}-fabric-company-seed
  namespace: {{ include "patchworks.fabric.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: fabric-company-seed
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: {{ .Values.seeds.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "fabric-company-seed" "Release" .Release) | nindent 8 }}
    spec:
      restartPolicy: {{ .Values.seeds.restartPolicy }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for Fabric MySQL..."
              until mysqladmin ping -h {{ include "patchworks.fabric.mysql.host" . }} -P {{ include "patchworks.fabric.mysql.port" . }} --silent; do sleep 2; done
              echo "Fabric MySQL ready."
      containers:
        {{- $fabricSeedSvc := merge (deepCopy .Values.seeds.fabric) .Values.fabric }}
        - name: fabric-company-seed
          image: {{ include "patchworks.appImage" (dict "svc" $fabricSeedSvc "root" .) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" $fabricSeedSvc "root" .) }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              php artisan app:create-tenant \
                --company-name={{ .Values.seeds.tenant.companyName | quote }} \
                --tier={{ .Values.seeds.tenant.tier | quote }} \
                --user-name={{ .Values.seeds.tenant.adminName | quote }} \
                --user-email={{ .Values.seeds.tenant.adminEmail | quote }} \
                --user-role={{ .Values.seeds.tenant.userRole | quote }} \
                --user-password="${TENANT_ADMIN_PASSWORD}"
          envFrom:
            - secretRef:
                name: {{ include "patchworks.passportSecretName" . }}
            {{- with (concat .Values.app.extraEnvFrom .Values.fabric.extraEnvFrom) }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "patchworks.fabricEnv" . | nindent 12 }}
            {{- if .Values.seeds.tenant.existingSecret.name }}
            - name: TENANT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.seeds.tenant.existingSecret.name }}
                  key: {{ .Values.seeds.tenant.existingSecret.passwordKey }}
            {{- else if .Values.seeds.tenant.adminPassword }}
            - name: TENANT_ADMIN_PASSWORD
              value: {{ .Values.seeds.tenant.adminPassword | quote }}
            {{- else }}
            - name: TENANT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "patchworks.fullname" . }}-tenant-admin
                  key: {{ .Values.seeds.tenant.existingSecret.passwordKey }}
            {{- end }}
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.fabric.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.seeds.fabric.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.seeds.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.seeds.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.seeds.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if and .Values.seeds.core.enabled .Values.seeds.fabric.enabled .Values.seeds.tenant.createDatabase }}
---
# Job — creates the initial Core tenant database after Fabric has recorded the
# tenant and before Core tenant migrations run.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "patchworks.fullname" . }}-tenant-database
  namespace: {{ include "patchworks.seeds.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-database
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: {{ .Values.seeds.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "tenant-database" "Release" .Release) | nindent 8 }}
    spec:
      restartPolicy: {{ .Values.seeds.restartPolicy }}
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL..."
              until mysqladmin ping -h {{ include "patchworks.mysql.host" . }} -P {{ include "patchworks.mysql.port" . }} --silent; do sleep 2; done
              echo "MySQL ready."
      containers:
        - name: tenant-database
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              mysql -h {{ include "patchworks.mysql.host" . }} -P {{ include "patchworks.mysql.port" . }} \
                -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" \
                -e "CREATE DATABASE IF NOT EXISTS \`{{ include "patchworks.seeds.tenantDatabase" . }}\`;"
              printf 'Tenant database %s ready.\n' {{ include "patchworks.seeds.tenantDatabase" . | quote }}
          env:
            - name: MYSQL_USER
              value: {{ include "patchworks.mysql.username" . | quote }}
            {{- $mysqlSecret := fromJson (include "patchworks.mysql.existingSecret" .) }}
            {{ include "patchworks.secretEnv" (dict "name" "MYSQL_PASSWORD" "value" (include "patchworks.mysql.password" .) "secret" (dict "name" $mysqlSecret.name "key" $mysqlSecret.passwordKey)) | nindent 12 }}
{{- end }}
{{- if .Values.seeds.core.enabled }}
---
# Job — Core first-install seeder (runs after Fabric migrations, Fabric
# seeders, Fabric company seed, tenant database creation, and Core migrations).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "patchworks.fullname" . }}-core-seeds
  namespace: {{ include "patchworks.seeds.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-seeds
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "20"
spec:
  backoffLimit: {{ .Values.seeds.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "core-seeds" "Release" .Release) | nindent 8 }}
    spec:
      restartPolicy: {{ .Values.seeds.restartPolicy }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL..."
              until mysqladmin ping -h {{ include "patchworks.mysql.host" . }} -P {{ include "patchworks.mysql.port" . }} --silent; do sleep 2; done
              echo "MySQL ready."
      containers:
        {{- $coreSeedSvc := merge (deepCopy .Values.seeds.core) (dict "image" .Values.image) }}
        - name: core-seeds
          image: {{ include "patchworks.appImage" (dict "svc" $coreSeedSvc "root" .) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" $coreSeedSvc "root" .) }}
          command:
            - /bin/sh
            - -c
            - {{ .Values.seeds.core.command | quote }}
          envFrom:
            - secretRef:
                name: {{ include "patchworks.passportSecretName" . }}
            {{- with .Values.app.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "patchworks.appEnv" . | nindent 12 }}
          {{- with .Values.seeds.core.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.seeds.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.seeds.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.seeds.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
