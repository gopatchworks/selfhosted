{{- if .Values.fabric.enabled }}
---
# ConfigMap for non-sensitive Fabric environment variables.
# Uses Fabric's own MySQL/Redis connection details.
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  name: {{ include "patchworks.fullname" . }}-fabric-config
  namespace: {{ include "patchworks.fabric.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
data:
  {{- include "patchworks.fabricConfigData" . | nindent 2 }}

{{- end }}
