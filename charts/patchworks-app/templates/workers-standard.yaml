{{- $isStandalone   := eq .Values.workers.type "standalone" }}
{{- $isMicroservice := eq .Values.workers.type "microservice" }}
{{- if or $isStandalone $isMicroservice }}
{{- $root     := . }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $hubNs    := include "patchworks.workers.namespace" . }}
{{- $default  := .Values.workers.microservices._default }}

{{/*
Build a flat list of service specs. Each entry carries everything needed to
emit a ConfigMap + Deployment pair without referring back to the outer type.

Standalone produces one entry (the hub); microservice produces one per enabled
key in workers.microservices (excluding _default).
*/}}
{{- $services := list }}
{{- if $isStandalone }}
  {{- $services = list (dict
    "slug"          "workers"
    "ns"            $hubNs
    "queue"         .Values.workers.queue.name
    "name"          ""
    "domain"        ""
    "replicas"      .Values.workers.replicaCount
    "processes"     (.Values.workers.processes | default 15)
    "resources"     .Values.workers.resources
    "podAnnotations" .Values.workers.podAnnotations
    "nodeSelector"  .Values.workers.nodeSelector
    "tolerations"   .Values.workers.tolerations
    "affinity"      .Values.workers.affinity
    "extraEnv"      (list)
    "extraEnvFrom"  (list)
  ) }}
{{- else }}
  {{- range $msKey, $ms := .Values.workers.microservices }}
  {{- if eq $msKey "_default" }}{{- continue }}{{- end }}
  {{- $enabled := dig "enabled" (dig "enabled" true $default) $ms }}
  {{- if not $enabled }}{{- continue }}{{- end }}
  {{- $svc := dict
    "slug"          (printf "workers-%s" $msKey)
    "ns"            ($ms.namespace | default $hubNs)
    "queue"         (dig "domain" $msKey $ms)
    "name"          (dig "name"   $msKey $ms)
    "domain"        (dig "domain" $msKey $ms)
    "replicas"      (dig "replicas"  (dig "replicas"  1  $default) $ms)
    "processes"     (dig "processes" (dig "processes" 15 $default) $ms)
    "resources"     ($ms.resources     | default $default.resources     | default $root.Values.workers.resources)
    "podAnnotations" ($ms.podAnnotations | default $default.podAnnotations | default $root.Values.workers.podAnnotations)
    "nodeSelector"  ($ms.nodeSelector  | default $default.nodeSelector  | default $root.Values.workers.nodeSelector)
    "tolerations"   ($ms.tolerations   | default $default.tolerations   | default $root.Values.workers.tolerations)
    "affinity"      ($ms.affinity      | default $default.affinity      | default $root.Values.workers.affinity)
    "extraEnv"      (dig "extraEnv"    (list) $ms)
    "extraEnvFrom"  (dig "extraEnvFrom" (list) $ms)
  }}
  {{- $services = append $services $svc }}
  {{- end }}
{{- end }}

{{- range $svc := $services }}

{{/* Build worker list: hub first, then one Deployment per company. */}}
{{- $workers := list (dict "isHub" true "company" (dict)) }}
{{- range $root.Values.workers.companies }}
{{- $workers = append $workers (dict "isHub" false "company" .) }}
{{- end }}

{{- range $workers }}
{{- $isHub   := .isHub }}
{{- $company := .company }}

{{- $slug         := $svc.slug }}
{{- $wNs          := $svc.ns }}
{{- $queue        := $svc.queue }}
{{- $replicas     := $svc.replicas }}
{{- $processes    := $svc.processes }}
{{- $resources    := $svc.resources }}
{{- $podAnnotations := $svc.podAnnotations }}
{{- $nodeSelector := $svc.nodeSelector }}
{{- $tolerations  := $svc.tolerations }}
{{- $affinity     := $svc.affinity }}
{{- if not $isHub }}
  {{- $slug         = printf "%s-%s" $svc.slug $company.name }}
  {{- $wNs          = $company.namespace   | default $svc.ns }}
  {{- $queue        = $company.queue       | default $company.name }}
  {{- $replicas     = dig "replicaCount" $svc.replicas $company }}
  {{- $processes    = dig "processes"   $svc.processes $company }}
  {{- $resources    = $company.resources      | default $svc.resources }}
  {{- $podAnnotations = $company.podAnnotations | default $svc.podAnnotations }}
  {{- $nodeSelector = $company.nodeSelector   | default $svc.nodeSelector }}
  {{- $tolerations  = $company.tolerations    | default $svc.tolerations }}
  {{- $affinity     = $company.affinity       | default $svc.affinity }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-{{ $slug }}-supervisord
  namespace: {{ $wNs }}
  labels:
    {{- include "patchworks.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $slug }}
data:
  supervisord.conf: |
    {{- include "patchworks.supervisordConf" (dict "connection" $root.Values.workers.queue.connection "queue" $queue "processes" $processes) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-{{ $slug }}
  namespace: {{ $wNs }}
  labels:
    {{- include "patchworks.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $slug }}
spec:
  replicas: {{ $replicas }}
  revisionHistoryLimit: {{ $root.Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "patchworks.selectorLabels" (dict "component" $slug "Release" $root.Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" $slug "Release" $root.Release) | nindent 8 }}
      annotations:
        checksum/config: {{ include "patchworks.appConfigData" $root | sha256sum }}
        {{- with $podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "patchworks.serviceAccountName" $root }}
      {{- with $root.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "patchworks.waitForDeps" $root | nindent 8 }}
      containers:
        - name: workers
          image: {{ include "patchworks.appImage" (dict "svc" $root.Values.workers "root" $root) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" $root.Values.workers "root" $root) }}
          command:
            - supervisord
            - -c
            - /etc/supervisor/conf.d/supervisord.conf
          {{- $envFrom := concat $root.Values.app.extraEnvFrom $root.Values.workers.extraEnvFrom $svc.extraEnvFrom }}
          {{- if not $isHub }}
          {{- $envFrom = concat $envFrom ($company.extraEnvFrom | default (list)) }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "patchworks.fullname" $root }}-config
            {{- if include "patchworks.appSecretHasData" $root }}
            - secretRef:
                name: {{ include "patchworks.fullname" $root }}-secret
            {{- end }}
            - secretRef:
                name: {{ include "patchworks.passportSecretName" $root }}
            {{- with $envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "patchworks.appSecretEnvRefs" $root | nindent 12 }}
            {{- if $svc.name }}
            - name: APP_NAME
              value: {{ $svc.name | quote }}
            - name: APP_DOMAIN
              value: {{ $svc.domain | quote }}
            {{- end }}
            - name: QUEUE_CONNECTION
              value: {{ $root.Values.workers.queue.connection | quote }}
            {{- with $root.Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $root.Values.workers.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $svc.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if not $isHub }}
            {{- with $company.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: supervisord-conf
              mountPath: /etc/supervisor/conf.d/supervisord.conf
              subPath: supervisord.conf
          {{- with $resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: supervisord-conf
          configMap:
            name: {{ $fullname }}-{{ $slug }}-supervisord
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}{{/* range $workers */}}
{{- end }}{{/* range $services */}}
{{- end }}{{/* if standalone or microservice */}}
