{{- if .Values.fabric.migrations.enabled }}
---
# Job — runs Fabric database migrations before Core migrations.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "patchworks.fullname" . }}-fabric-migrations
  namespace: {{ include "patchworks.fabric.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: fabric-migrations
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-3"
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "fabric-migrations" "Release" .Release) | nindent 8 }}
    spec:
      restartPolicy: {{ .Values.migrations.restartPolicy }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for Fabric MySQL..."
              until mysqladmin ping -h {{ include "patchworks.fabric.mysql.host" . }} -P {{ include "patchworks.fabric.mysql.port" . }} --silent; do sleep 2; done
              echo "Fabric MySQL ready."
      containers:
        - name: fabric-migrations
          image: {{ include "patchworks.appImage" (dict "svc" .Values.fabric "root" .) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" .Values.fabric "root" .) }}
          command: ["/bin/sh", "-c", {{ .Values.fabric.migrations.command | quote }}]
          envFrom:
            - secretRef:
                name: {{ include "patchworks.passportSecretName" . }}
            {{- with (concat .Values.app.extraEnvFrom .Values.fabric.extraEnvFrom) }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "patchworks.fabricEnv" . | nindent 12 }}
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.fabric.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.migrations.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.migrations.enabled }}
---
# Job — runs Core database migrations before Core seeders and app pods.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "patchworks.fullname" . }}-core-migrations
  namespace: {{ include "patchworks.migrations.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-migrations
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "10"
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "core-migrations" "Release" .Release) | nindent 8 }}
    spec:
      restartPolicy: {{ .Values.migrations.restartPolicy }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL..."
              until mysqladmin ping -h {{ include "patchworks.mysql.host" . }} -P {{ include "patchworks.mysql.port" . }} --silent; do sleep 2; done
              echo "MySQL ready."
      containers:
        - name: core-migrations
          image: {{ include "patchworks.appImage" (dict "svc" .Values.migrations "root" .) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" .Values.migrations "root" .) }}
          command: ["/bin/sh", "-c", {{ .Values.migrations.command | quote }}]
          envFrom:
            - secretRef:
                name: {{ include "patchworks.passportSecretName" . }}
            {{- with .Values.app.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "patchworks.appEnv" . | nindent 12 }}
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.migrations.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
