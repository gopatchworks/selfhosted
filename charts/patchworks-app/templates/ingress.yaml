{{- if .Values.ingress.enabled }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $ing := .Values.ingress }}
{{- $services := list
  (dict "enabled" .Values.web.gateway.enabled "host" $ing.hosts.gateway "svcName" (printf "%s-gateway"  $fullname) "ns" (include "patchworks.gateway.namespace"  .) "tlsSecret" (dig "gateway"  "secretName" "" $ing.tls))
  (dict "enabled" .Values.web.start.enabled "host" $ing.hosts.start   "svcName" (printf "%s-start"    $fullname) "ns" (include "patchworks.start.namespace"    .) "tlsSecret" (dig "start"    "secretName" "" $ing.tls))
  (dict "enabled" .Values.web.start.enabled "host" $ing.hosts.webhook "svcName" (printf "%s-start"    $fullname) "ns" (include "patchworks.start.namespace"    .) "tlsSecret" (dig "webhook"  "secretName" "" $ing.tls) "name" (printf "%s-webhook" $fullname))
  (dict "enabled" .Values.web.start.enabled "host" $ing.hosts.callback "svcName" (printf "%s-start"   $fullname) "ns" (include "patchworks.start.namespace"    .) "tlsSecret" (dig "callback" "secretName" "" $ing.tls) "name" (printf "%s-callback" $fullname))
  (dict "enabled" .Values.fabric.enabled "host" $ing.hosts.fabric  "svcName" (printf "%s-fabric"   $fullname) "ns" (include "patchworks.fabric.namespace"   .) "tlsSecret" (dig "fabric"   "secretName" "" $ing.tls))
}}
{{- $timeoutPolicy := dict }}
{{- if $ing.timeout }}
{{- $_ := set $timeoutPolicy "response" (printf "%vs" $ing.timeout) }}
{{- $_ =  set $timeoutPolicy "idle"     (printf "%vs" $ing.timeout) }}
{{- end }}
{{- range $services }}
{{- if and .enabled .host }}
{{- $resourceName := .name | default .svcName }}
{{- if eq $ing.provider "contour" }}
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ $resourceName }}
  namespace: {{ .ns }}
  labels:
    {{- include "patchworks.labels" $ | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  virtualhost:
    fqdn: {{ .host | quote }}
    {{- if .tlsSecret }}
    tls:
      secretName: {{ .tlsSecret | quote }}
    {{- end }}
  routes:
    - conditions:
        - prefix: /
      {{- with $timeoutPolicy }}
      timeoutPolicy:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ .svcName }}
          port: 80
{{- else }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $resourceName }}
  namespace: {{ .ns }}
  labels:
    {{- include "patchworks.labels" $ | nindent 4 }}
  {{- include "patchworks.ingress.serviceAnnotations" $ | nindent 2 }}
spec:
  {{- if $ing.className }}
  ingressClassName: {{ $ing.className }}
  {{- end }}
  {{- if and .host .tlsSecret }}
  tls:
    - secretName: {{ .tlsSecret }}
      hosts:
        - {{ .host | quote }}
  {{- end }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .svcName }}
                port:
                  name: http
{{- end }}
{{- end }}
{{- end }}
{{- $dashNs := include "patchworks.dashboard.namespace" . }}
{{- $routes := list }}
{{- if eq .Values.dashboard.routingMode "path" }}
{{- range (list
  (dict "enabled" .Values.fabric.enabled "path" "/fabric" "component" "fabric" "ns" (include "patchworks.fabric.namespace" .))
  (dict "enabled" .Values.web.gateway.enabled "path" "/core-main" "component" "gateway" "ns" (include "patchworks.gateway.namespace" .))
  (dict "enabled" .Values.web.start.enabled "path" "/core-start" "component" "start" "ns" (include "patchworks.start.namespace" .))) }}
{{- if and .enabled (eq .ns $dashNs) }}{{- $routes = append $routes . }}{{- end }}
{{- end }}
{{- end }}
{{- if and $ing.hosts.dashboard (or .Values.dashboard.enabled $routes) }}
{{- if eq $ing.provider "contour" }}
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ $fullname }}-dashboard
  namespace: {{ $dashNs }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  virtualhost:
    fqdn: {{ $ing.hosts.dashboard | quote }}
    {{- $tlsSecret := dig "dashboard" "secretName" "" $ing.tls }}
    {{- if $tlsSecret }}
    tls:
      secretName: {{ $tlsSecret | quote }}
    {{- end }}
  routes:
    {{- range $routes }}
    - conditions:
        - prefix: {{ .path }}
      pathRewritePolicy:
        replacePrefix:
          - replacement: /
      {{- with $timeoutPolicy }}
      timeoutPolicy:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ $fullname }}-{{ .component }}
          port: 80
    {{- end }}
    {{- if .Values.dashboard.enabled }}
    - conditions:
        - prefix: /
      {{- with $timeoutPolicy }}
      timeoutPolicy:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ $fullname }}-dashboard
          port: 80
    {{- end }}
{{- else }}
{{- if $routes }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-dashboard-routes
  namespace: {{ $dashNs }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
  annotations:
    {{- with $ing.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $ing.rewriteAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and (eq $ing.provider "nginx") $ing.timeout }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ toString $ing.timeout | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ toString $ing.timeout | quote }}
    {{- end }}
    {{- if and (eq $ing.provider "nginx") $ing.maxBodySize }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ $ing.maxBodySize | quote }}
    {{- end }}
spec:
  {{- if $ing.className }}
  ingressClassName: {{ $ing.className }}
  {{- end }}
  {{- $dashTlsSecret := dig "dashboard" "secretName" "" $ing.tls }}
  {{- if $dashTlsSecret }}
  tls:
    - secretName: {{ $dashTlsSecret }}
      hosts:
        - {{ $ing.hosts.dashboard | quote }}
  {{- end }}
  rules:
    - host: {{ $ing.hosts.dashboard | quote }}
      http:
        paths:
          {{- range $routes }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-{{ .component }}
                port:
                  name: http
          {{- end }}
{{- end }}
{{- if .Values.dashboard.enabled }}
---
# Dashboard Ingress — serves the dashboard at /.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-dashboard
  namespace: {{ $dashNs }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
  annotations:
    {{- with $ing.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and (eq $ing.provider "nginx") $ing.timeout }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ toString $ing.timeout | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ toString $ing.timeout | quote }}
    {{- end }}
    {{- if and (eq $ing.provider "nginx") $ing.maxBodySize }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ $ing.maxBodySize | quote }}
    {{- end }}
spec:
  {{- if $ing.className }}
  ingressClassName: {{ $ing.className }}
  {{- end }}
  {{- $dashTlsSecret := dig "dashboard" "secretName" "" $ing.tls }}
  {{- if $dashTlsSecret }}
  tls:
    - secretName: {{ $dashTlsSecret }}
      hosts:
        - {{ $ing.hosts.dashboard | quote }}
  {{- end }}
  rules:
    - host: {{ $ing.hosts.dashboard | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-dashboard
                port:
                  name: http
{{- end }}
{{- end }}
{{- end }}
{{- end }}
