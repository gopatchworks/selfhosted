{{- if .Values.ingress.enabled }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $ing := .Values.ingress }}
{{- /*
Routes of the start, webhook and callback hosts. Every one goes to Core's start
Service unless the hub Monocore worker serves inbound triggers: then the paths
Monocore serves go to its public listener. The start API answers on any host;
webhooks and callbacks under /api/v1/ on their own hosts, where Core also
answers the one-time callback (/api/v1/otc/...) and its MCP proxy
(/api/v1/mcp) on any host, so those stay on Core. Core still serves every
inbound route, so a path left on Core is answered correctly either way.
*/}}
{{- $coreStart := printf "%s-start" $fullname }}
{{- $startRoutes := list (dict "path" "/" "prefix" "/" "svcName" $coreStart) }}
{{- $triggerRoutes := $startRoutes }}
{{- if and (include "patchworks.mono.inbound" .) .Values.workers.mono.inbound.ingress.enabled .Values.web.start.enabled (or $ing.hosts.start $ing.hosts.webhook $ing.hosts.callback) }}
{{- $startNs := include "patchworks.start.namespace" . }}
{{- $monoNs := include "patchworks.workers.namespace" . }}
{{- if ne $startNs $monoNs }}
{{- fail (printf "workers.mono.inbound.ingress.enabled routes the start, webhook and callback hosts (namespace %s) to the Monocore hub (namespace %s), and an Ingress cannot reach a Service in another namespace: put them in one namespace, or set workers.mono.inbound.ingress.enabled=false and route to the %s Service yourself" $startNs $monoNs (include "patchworks.mono.inboundService" .)) }}
{{- end }}
{{- $monocore := include "patchworks.mono.inboundService" . }}
{{- $startRoutes = prepend $startRoutes (dict "path" "/api/v1/flows" "prefix" "/api/v1/flows/" "svcName" $monocore) }}
{{- $triggerRoutes = concat (list
  (dict "path" "/api/v1/otc" "prefix" "/api/v1/otc/" "svcName" $coreStart)
  (dict "path" "/api/v1/mcp" "prefix" "/api/v1/mcp"  "svcName" $coreStart)
  (dict "path" "/api/v1"     "prefix" "/api/v1/"     "svcName" $monocore)) $triggerRoutes }}
{{- end }}
{{- $services := list
  (dict "enabled" .Values.web.gateway.enabled "host" $ing.hosts.gateway "svcName" (printf "%s-gateway"  $fullname) "ns" (include "patchworks.gateway.namespace"  .) "tlsSecret" (dig "gateway"  "secretName" "" $ing.tls))
  (dict "enabled" .Values.web.start.enabled "host" $ing.hosts.start   "svcName" $coreStart "ns" (include "patchworks.start.namespace"    .) "tlsSecret" (dig "start"    "secretName" "" $ing.tls) "routes" $startRoutes)
  (dict "enabled" .Values.web.start.enabled "host" $ing.hosts.webhook "svcName" $coreStart "ns" (include "patchworks.start.namespace"    .) "tlsSecret" (dig "webhook"  "secretName" "" $ing.tls) "name" (printf "%s-webhook" $fullname) "routes" $triggerRoutes)
  (dict "enabled" .Values.web.start.enabled "host" $ing.hosts.callback "svcName" $coreStart "ns" (include "patchworks.start.namespace"    .) "tlsSecret" (dig "callback" "secretName" "" $ing.tls) "name" (printf "%s-callback" $fullname) "routes" $triggerRoutes)
  (dict "enabled" .Values.fabric.enabled "host" $ing.hosts.fabric  "svcName" (printf "%s-fabric"   $fullname) "ns" (include "patchworks.fabric.namespace"   .) "tlsSecret" (dig "fabric"   "secretName" "" $ing.tls))
}}
{{- $timeoutPolicy := dict }}
{{- if $ing.timeout }}
{{- $_ := set $timeoutPolicy "response" (printf "%vs" $ing.timeout) }}
{{- $_ =  set $timeoutPolicy "idle"     (printf "%vs" $ing.timeout) }}
{{- end }}
{{- range $services }}
{{- if and .enabled .host }}
{{- $resourceName := .name | default .svcName }}
{{- $routes := .routes | default (list (dict "path" "/" "prefix" "/" "svcName" .svcName)) }}
{{- if eq $ing.provider "contour" }}
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ $resourceName }}
  namespace: {{ .ns }}
  labels:
    {{- include "patchworks.labels" $ | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  virtualhost:
    fqdn: {{ .host | quote }}
    {{- if .tlsSecret }}
    tls:
      secretName: {{ .tlsSecret | quote }}
    {{- end }}
  routes:
    {{- range $routes }}
    - conditions:
        - prefix: {{ .prefix }}
      {{- with $timeoutPolicy }}
      timeoutPolicy:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ .svcName }}
          port: 80
    {{- end }}
{{- else }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $resourceName }}
  namespace: {{ .ns }}
  labels:
    {{- include "patchworks.labels" $ | nindent 4 }}
  {{- include "patchworks.ingress.serviceAnnotations" $ | nindent 2 }}
spec:
  {{- if $ing.className }}
  ingressClassName: {{ $ing.className }}
  {{- end }}
  {{- if and .host .tlsSecret }}
  tls:
    - secretName: {{ .tlsSecret }}
      hosts:
        - {{ .host | quote }}
  {{- end }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range $routes }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .svcName }}
                port:
                  name: http
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $dashNs := include "patchworks.dashboard.namespace" . }}
{{- $routes := list }}
{{- if eq .Values.dashboard.routingMode "path" }}
{{- range (list
  (dict "enabled" .Values.fabric.enabled "path" "/fabric" "component" "fabric" "ns" (include "patchworks.fabric.namespace" .))
  (dict "enabled" .Values.web.gateway.enabled "path" "/core-main" "component" "gateway" "ns" (include "patchworks.gateway.namespace" .))
  (dict "enabled" .Values.web.start.enabled "path" "/core-start" "component" "start" "ns" (include "patchworks.start.namespace" .))) }}
{{- if and .enabled (eq .ns $dashNs) }}{{- $routes = append $routes . }}{{- end }}
{{- end }}
{{- end }}
{{- if and $ing.hosts.dashboard (or .Values.dashboard.enabled $routes) }}
{{- if eq $ing.provider "contour" }}
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ $fullname }}-dashboard
  namespace: {{ $dashNs }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  virtualhost:
    fqdn: {{ $ing.hosts.dashboard | quote }}
    {{- $tlsSecret := dig "dashboard" "secretName" "" $ing.tls }}
    {{- if $tlsSecret }}
    tls:
      secretName: {{ $tlsSecret | quote }}
    {{- end }}
  routes:
    {{- range $routes }}
    - conditions:
        - prefix: {{ .path }}
      pathRewritePolicy:
        replacePrefix:
          - replacement: /
      {{- with $timeoutPolicy }}
      timeoutPolicy:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ $fullname }}-{{ .component }}
          port: 80
    {{- end }}
    {{- if .Values.dashboard.enabled }}
    - conditions:
        - prefix: /
      {{- with $timeoutPolicy }}
      timeoutPolicy:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ $fullname }}-dashboard
          port: 80
    {{- end }}
{{- else }}
{{- if $routes }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-dashboard-routes
  namespace: {{ $dashNs }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
  annotations:
    {{- with $ing.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $ing.rewriteAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and (eq $ing.provider "nginx") $ing.timeout }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ toString $ing.timeout | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ toString $ing.timeout | quote }}
    {{- end }}
    {{- if and (eq $ing.provider "nginx") $ing.maxBodySize }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ $ing.maxBodySize | quote }}
    {{- end }}
spec:
  {{- if $ing.className }}
  ingressClassName: {{ $ing.className }}
  {{- end }}
  {{- $dashTlsSecret := dig "dashboard" "secretName" "" $ing.tls }}
  {{- if $dashTlsSecret }}
  tls:
    - secretName: {{ $dashTlsSecret }}
      hosts:
        - {{ $ing.hosts.dashboard | quote }}
  {{- end }}
  rules:
    - host: {{ $ing.hosts.dashboard | quote }}
      http:
        paths:
          {{- range $routes }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-{{ .component }}
                port:
                  name: http
          {{- end }}
{{- end }}
{{- if .Values.dashboard.enabled }}
---
# Dashboard Ingress — serves the dashboard at /.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-dashboard
  namespace: {{ $dashNs }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
  annotations:
    {{- with $ing.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and (eq $ing.provider "nginx") $ing.timeout }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ toString $ing.timeout | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ toString $ing.timeout | quote }}
    {{- end }}
    {{- if and (eq $ing.provider "nginx") $ing.maxBodySize }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ $ing.maxBodySize | quote }}
    {{- end }}
spec:
  {{- if $ing.className }}
  ingressClassName: {{ $ing.className }}
  {{- end }}
  {{- $dashTlsSecret := dig "dashboard" "secretName" "" $ing.tls }}
  {{- if $dashTlsSecret }}
  tls:
    - secretName: {{ $dashTlsSecret }}
      hosts:
        - {{ $ing.hosts.dashboard | quote }}
  {{- end }}
  rules:
    - host: {{ $ing.hosts.dashboard | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-dashboard
                port:
                  name: http
{{- end }}
{{- end }}
{{- end }}
{{- end }}
