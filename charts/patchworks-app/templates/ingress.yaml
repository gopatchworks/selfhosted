{{- if .Values.ingress.enabled }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $ing := .Values.ingress }}
{{- $services := list
  (dict "host" $ing.hosts.gateway "svcName" (printf "%s-gateway"  $fullname) "ns" (include "patchworks.gateway.namespace"  .) "tlsSecret" (dig "gateway"  "secretName" "" $ing.tls))
  (dict "host" $ing.hosts.start   "svcName" (printf "%s-start"    $fullname) "ns" (include "patchworks.start.namespace"    .) "tlsSecret" (dig "start"    "secretName" "" $ing.tls))
  (dict "host" $ing.hosts.webhook "svcName" (printf "%s-start"    $fullname) "ns" (include "patchworks.start.namespace"    .) "tlsSecret" (dig "webhook"  "secretName" "" $ing.tls) "name" (printf "%s-webhook" $fullname))
  (dict "host" $ing.hosts.callback "svcName" (printf "%s-start"   $fullname) "ns" (include "patchworks.start.namespace"    .) "tlsSecret" (dig "callback" "secretName" "" $ing.tls) "name" (printf "%s-callback" $fullname))
  (dict "host" $ing.hosts.fabric  "svcName" (printf "%s-fabric"   $fullname) "ns" (include "patchworks.fabric.namespace"   .) "tlsSecret" (dig "fabric"   "secretName" "" $ing.tls))
}}
{{- range $services }}
{{- if .host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name | default .svcName }}
  namespace: {{ .ns }}
  labels:
    {{- include "patchworks.labels" $ | nindent 4 }}
  {{- include "patchworks.ingress.serviceAnnotations" $ | nindent 2 }}
spec:
  {{- if $ing.className }}
  ingressClassName: {{ $ing.className }}
  {{- end }}
  {{- if and .host .tlsSecret }}
  tls:
    - secretName: {{ .tlsSecret }}
      hosts:
        - {{ .host | quote }}
  {{- end }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .svcName }}
                port:
                  name: http
{{- end }}
{{- end }}
{{- if $ing.hosts.dashboard }}
{{- $dashNs := include "patchworks.dashboard.namespace" . }}
{{- if eq $ing.provider "contour" }}
---
# Contour HTTPProxy — native prefix rewriting for /fabric, /core-main, /core-start
# and catch-all to dashboard. Requires the Contour CRD (projectcontour.io/v1).
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ $fullname }}-dashboard
  namespace: {{ $dashNs }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  virtualhost:
    fqdn: {{ $ing.hosts.dashboard | quote }}
    {{- $tlsSecret := dig "dashboard" "secretName" "" $ing.tls }}
    {{- if $tlsSecret }}
    tls:
      secretName: {{ $tlsSecret | quote }}
    {{- end }}
  routes:
    {{- $timeoutPolicy := dict }}
    {{- if $ing.timeout }}
    {{- $_ := set $timeoutPolicy "response" (printf "%vs" $ing.timeout) }}
    {{- $_ =  set $timeoutPolicy "idle"     (printf "%vs" $ing.timeout) }}
    {{- end }}
    - conditions:
        - prefix: /fabric
      pathRewritePolicy:
        replacePrefix:
          - replacement: /
      {{- with $timeoutPolicy }}
      timeoutPolicy:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ $fullname }}-fabric
          port: 80
    - conditions:
        - prefix: /core-main
      pathRewritePolicy:
        replacePrefix:
          - replacement: /
      {{- with $timeoutPolicy }}
      timeoutPolicy:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ $fullname }}-gateway
          port: 80
    - conditions:
        - prefix: /core-start
      pathRewritePolicy:
        replacePrefix:
          - replacement: /
      {{- with $timeoutPolicy }}
      timeoutPolicy:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ $fullname }}-start
          port: 80
    {{- if .Values.dashboard.enabled }}
    - conditions:
        - prefix: /
      {{- with $timeoutPolicy }}
      timeoutPolicy:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ $fullname }}-dashboard
          port: 80
    {{- end }}
{{- else }}
---
# Path-rewriting Ingress — strips /fabric, /core-main, /core-start prefixes
# before forwarding to their respective services.
# See ingress.rewriteAnnotations in values.yaml for controller-specific config.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-dashboard-routes
  namespace: {{ $dashNs }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
  annotations:
    {{- with $ing.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $ing.rewriteAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and (eq $ing.provider "nginx") $ing.timeout }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ toString $ing.timeout | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ toString $ing.timeout | quote }}
    {{- end }}
    {{- if and (eq $ing.provider "nginx") $ing.maxBodySize }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ $ing.maxBodySize | quote }}
    {{- end }}
spec:
  {{- if $ing.className }}
  ingressClassName: {{ $ing.className }}
  {{- end }}
  {{- $dashTlsSecret := dig "dashboard" "secretName" "" $ing.tls }}
  {{- if $dashTlsSecret }}
  tls:
    - secretName: {{ $dashTlsSecret }}
      hosts:
        - {{ $ing.hosts.dashboard | quote }}
  {{- end }}
  rules:
    - host: {{ $ing.hosts.dashboard | quote }}
      http:
        paths:
          - path: /fabric
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-fabric
                port:
                  name: http
          - path: /core-main
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-gateway
                port:
                  name: http
          - path: /core-start
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-start
                port:
                  name: http
{{- if .Values.dashboard.enabled }}
---
# Dashboard Ingress — serves the dashboard at /.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-dashboard
  namespace: {{ $dashNs }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
  annotations:
    {{- with $ing.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and (eq $ing.provider "nginx") $ing.timeout }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ toString $ing.timeout | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ toString $ing.timeout | quote }}
    {{- end }}
    {{- if and (eq $ing.provider "nginx") $ing.maxBodySize }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ $ing.maxBodySize | quote }}
    {{- end }}
spec:
  {{- if $ing.className }}
  ingressClassName: {{ $ing.className }}
  {{- end }}
  {{- $dashTlsSecret := dig "dashboard" "secretName" "" $ing.tls }}
  {{- if $dashTlsSecret }}
  tls:
    - secretName: {{ $dashTlsSecret }}
      hosts:
        - {{ $ing.hosts.dashboard | quote }}
  {{- end }}
  rules:
    - host: {{ $ing.hosts.dashboard | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-dashboard
                port:
                  name: http
{{- end }}
{{- end }}
{{- end }}
{{- end }}
