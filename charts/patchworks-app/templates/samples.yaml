{{- if .Values.samples.enabled }}
{{- $samplesSvc := merge (deepCopy .Values.samples) (dict "image" .Values.image) }}
{{- $ns := include "patchworks.seeds.namespace" . }}
---
# ConfigMap — the sample installer, mounted into the samples Job. The PHP is
# copied verbatim, never through tpl: the flows hold flow variable placeholders
# in double braces that Patchworks resolves at run time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "patchworks.fullname" . }}-samples
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: samples
data:
  install.php: |-
    {{- .Files.Get "files/samples/install.php" | nindent 4 }}
  lib.php: |-
    {{- .Files.Get "files/samples/lib.php" | nindent 4 }}
  layout.php: |-
    {{- .Files.Get "files/samples/layout.php" | nindent 4 }}
  flows.php: |-
    {{- .Files.Get "files/samples/flows.php" | nindent 4 }}
---
# Job — creates the sample flows that are missing, after every install and
# upgrade. Samples that already exist are left unchanged.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "patchworks.fullname" . }}-samples
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: samples
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: {{ .Values.samples.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "samples" "Release" .Release) | nindent 8 }}
      annotations:
        checksum/samples: {{ printf "%s%s%s%s" (.Files.Get "files/samples/install.php") (.Files.Get "files/samples/lib.php") (.Files.Get "files/samples/layout.php") (.Files.Get "files/samples/flows.php") | sha256sum }}
    spec:
      {{- include "patchworks.podDnsConfig" (list .Values .Values.samples) | nindent 6 }}
      restartPolicy: Never
      {{- with .Values.migrations.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: samples
          image: {{ include "patchworks.appImage" (dict "svc" $samplesSvc "root" .) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" $samplesSvc "root" .) }}
          workingDir: /var/www/html
          {{- include "patchworks.phpCliCommandArgs" (dict "root" . "svc" $samplesSvc "args" (list "/opt/patchworks-samples/install.php")) | nindent 10 }}
          envFrom:
            - secretRef:
                name: {{ include "patchworks.passportSecretName" . }}
            {{- with .Values.app.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "patchworks.appEnv" . | nindent 12 }}
            - name: SAMPLES_COMPANY_NAME
              value: {{ include "patchworks.samples.companyName" . | quote }}
            - name: SAMPLES_USER_EMAIL
              value: {{ include "patchworks.samples.userEmail" . | quote }}
            - name: SAMPLES_FOLDER
              value: {{ .Values.samples.folder | default "Samples" | quote }}
            - name: SAMPLES_CONNECTOR_URL
              value: {{ printf "%s/healthz" (include "patchworks.monocore.url" .) | quote }}
          volumeMounts:
            - name: samples
              mountPath: /opt/patchworks-samples
              readOnly: true
          {{- with .Values.samples.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: samples
          configMap:
            name: {{ include "patchworks.fullname" . }}-samples
      {{- with .Values.samples.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.samples.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.samples.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
