{{- if .Values.rabbitmq.topology.enabled }}
{{- $root := . }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $queues := list }}
{{- $queueSet := dict }}
{{- range .Values.processors }}
{{- if not . }}{{- continue }}{{- end }}
{{- $enabled := true }}
{{- if hasKey . "enabled" }}{{- $enabled = .enabled }}{{- end }}
{{- if and $enabled .queue }}
{{- if not (hasKey $queueSet .queue) }}
{{- $queues = append $queues .queue }}
{{- $_ := set $queueSet .queue true }}
{{- end }}
{{- end }}
{{- end }}
{{- if eq .Values.workers.type "standalone" }}
{{- $queue := .Values.workers.queue.name | default "default" }}
{{- if not (hasKey $queueSet $queue) }}
{{- $queues = append $queues $queue }}
{{- $_ := set $queueSet $queue true }}
{{- end }}
{{- else if eq .Values.workers.type "microservice" }}
{{- $default := .Values.workers.microservices._default }}
{{- range $msKey, $ms := .Values.workers.microservices }}
{{- if eq $msKey "_default" }}{{- continue }}{{- end }}
{{- $enabled := dig "enabled" (dig "enabled" true $default) $ms }}
{{- if not $enabled }}{{- continue }}{{- end }}
{{- $queue := dig "domain" $msKey $ms }}
{{- if not (hasKey $queueSet $queue) }}
{{- $queues = append $queues $queue }}
{{- $_ := set $queueSet $queue true }}
{{- end }}
{{- end }}
{{- end }}
{{- if $queues }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-rabbitmq-topology
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq-topology
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-5"
data:
  topology.yaml: |
    vhost: {{ include "patchworks.rabbitmq.vhost" . | quote }}
    queues:
      {{- range $queue := $queues }}
      - name: {{ $queue | quote }}
        type: {{ $.Values.rabbitmq.topology.queueType | quote }}
        durable: true
      {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-rabbitmq-topology
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq-topology
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-4"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-4"
spec:
  backoffLimit: {{ .Values.rabbitmq.topology.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.rabbitmq.topology.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "rabbitmq-topology" "Release" .Release) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rabbitmq-topology
          image: {{ include "patchworks.appImage" (dict "svc" .Values.workers.mono "root" .) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" .Values.workers.mono "root" .) }}
          env:
            {{- include "patchworks.env.rabbitmqPassword" . | nindent 12 }}
            {{- include "patchworks.env.rabbitmq" . | nindent 12 }}
          {{- with .Values.rabbitmq.topology.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.rabbitmq.topology.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: topology
              mountPath: /etc/patchworks/rabbitmq
              readOnly: true
      volumes:
        - name: topology
          configMap:
            name: {{ $fullname }}-rabbitmq-topology
{{- end }}
{{- end }}
