{{- if .Values.rabbitmq.topology.enabled }}
{{- $root := . }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $queues := list }}
{{- range .Values.processors }}
{{- if not . }}{{- continue }}{{- end }}
{{- $enabled := true }}
{{- if hasKey . "enabled" }}{{- $enabled = .enabled }}{{- end }}
{{- if and $enabled .queue }}
{{- $queues = append $queues .queue }}
{{- end }}
{{- end }}
{{- if $queues }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-rabbitmq-topology
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq-topology
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-4"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-4"
spec:
  backoffLimit: {{ .Values.rabbitmq.topology.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.rabbitmq.topology.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "rabbitmq-topology" "Release" .Release) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rabbitmq-topology
          image: "{{ .Values.rabbitmq.topology.image.repository }}:{{ .Values.rabbitmq.topology.image.tag }}"
          imagePullPolicy: {{ .Values.rabbitmq.topology.image.pullPolicy }}
          env:
            {{- include "patchworks.env.rabbitmqPassword" . | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -eu

              base_url={{ printf "%s://%s:%s" (include "patchworks.rabbitmq.managementScheme" .) (include "patchworks.rabbitmq.host" .) (include "patchworks.rabbitmq.managementPort" .) | quote }}
              username={{ include "patchworks.rabbitmq.username" . | quote }}
              vhost={{ include "patchworks.rabbitmq.vhost" . | quote }}
              vhost_path={{ include "patchworks.rabbitmq.vhost" . | urlquery | quote }}

              echo "Waiting for RabbitMQ management API at ${base_url}..."
              {{- range $queue := $queues }}
              echo "Ensuring RabbitMQ queue {{ $queue }} exists..."
              until curl -fsS -u "${username}:${RABBITMQ_PASSWORD}" \
                  -X PUT "${base_url}/api/queues/${vhost_path}/{{ $queue | urlquery }}" \
                  -H "content-type: application/json" \
                  -d '{"durable":true,"auto_delete":false,"arguments":{"x-queue-type":"quorum"}}'; do
                sleep 2
              done
              {{- end }}
{{- end }}
{{- end }}
