{{- if and .Values.seeds.fabric.enabled (not .Values.seeds.tenant.adminPassword) (not .Values.seeds.tenant.existingSecret.name) }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $ns := include "patchworks.fabric.namespace" . }}
{{- $saName := printf "%s-tenant-admin-keygen" $fullname }}
{{- $secretName := printf "%s-tenant-admin" $fullname }}
{{- $secretKey := .Values.seeds.tenant.existingSecret.passwordKey }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-admin-keygen
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-4"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-4"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName }}
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-admin-keygen
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-4"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-4"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-admin-keygen
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-4"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-4"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-tenant-admin-keygen
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-admin-keygen
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-4"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-4"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "tenant-admin-keygen" "Release" .Release) | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $saName }}
      containers:
        - name: keygen
          image: "{{ .Values.credentials.generator.image.repository }}:{{ .Values.credentials.generator.image.tag }}"
          imagePullPolicy: {{ .Values.credentials.generator.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu

              if kubectl -n {{ $ns | quote }} get secret {{ $secretName | quote }} >/dev/null 2>&1; then
                echo "Tenant admin password secret already exists."
                exit 0
              fi

              admin_password="$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)"
              kubectl -n {{ $ns | quote }} create secret generic {{ $secretName | quote }} \
                "--from-literal={{ $secretKey }}=${admin_password}"
              echo "Tenant admin password secret created."
{{- end }}
