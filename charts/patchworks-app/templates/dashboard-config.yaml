{{- if .Values.dashboard.enabled }}
---
# ConfigMap for dashboard-specific environment variables.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "patchworks.fullname" . }}-dashboard-config
  namespace: {{ include "patchworks.dashboard.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
data:
  {{- include "patchworks.dashboardConfigData" . | nindent 2 }}
{{- end }}
