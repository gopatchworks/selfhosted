{{- if .Values.dashboard.enabled }}
---
# Static browser config mounted over /usr/share/nginx/html/config.js.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "patchworks.fullname" . }}-dashboard-config-js
  namespace: {{ include "patchworks.dashboard.namespace" . }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
data:
  config.js: |
    {{- include "patchworks.dashboardConfigJs" . | nindent 4 }}
{{- end }}
