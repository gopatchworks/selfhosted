{{- if .Values.scheduler.enabled }}
{{- $root := . }}
{{- range $processor := .Values.processors }}
{{- if not $processor }}{{- continue }}{{- end }}
{{- $enabled := true }}
{{- if hasKey $processor "enabled" }}{{- $enabled = $processor.enabled }}{{- end }}
{{- if $enabled }}
{{- $queue := required "processors[].queue is required" $processor.queue }}
{{- $processorName := $processor.name | default $queue }}
{{- $slug := regexReplaceAll "[^a-z0-9-]" (lower $queue) "-" | trimAll "-" }}
{{- $processorScheduler := $processor.scheduler | default dict }}
{{- $sched := mergeOverwrite (deepCopy $root.Values.scheduler) $processorScheduler -}}
{{- if $sched.enabled }}
{{- $namespace := $processor.namespace | default (include "patchworks.workers.namespace" $root) -}}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "patchworks.fullname" $root }}-{{ $slug }}-scheduler
  namespace: {{ $namespace }}
  labels:
    {{- include "patchworks.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $slug }}-scheduler
spec:
  schedule: {{ $sched.schedule | default $root.Values.scheduler.schedule | quote }}
  suspend: {{ $sched.suspend }}
  concurrencyPolicy: {{ $sched.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ $sched.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $sched.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ $sched.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "patchworks.selectorLabels" (dict "component" (printf "%s-scheduler" $slug) "Release" $root.Release) | nindent 12 }}
          annotations:
            checksum/config: {{ include "patchworks.appConfigData" $root | sha256sum }}
            {{- with $sched.podAnnotations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          restartPolicy: {{ $sched.restartPolicy }}
          activeDeadlineSeconds: {{ $sched.activeDeadlineSeconds }}
          serviceAccountName: {{ include "patchworks.serviceAccountName" $root }}
          {{- with $root.Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          initContainers:
            {{- include "patchworks.waitForDeps" $root | nindent 12 }}
          containers:
            - name: {{ $slug }}-scheduler
              image: {{ include "patchworks.appImage" (dict "svc" $root.Values.workers "root" $root) | quote }}
              imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" $root.Values.workers "root" $root) }}
              command:
                {{- toYaml $sched.command | nindent 16 }}
              args:
                {{- toYaml $sched.args | nindent 16 }}
              envFrom:
                - configMapRef:
                    name: {{ include "patchworks.fullname" $root }}-config
                {{- if include "patchworks.appSecretHasData" $root }}
                - secretRef:
                    name: {{ include "patchworks.fullname" $root }}-secret
                {{- end }}
                - secretRef:
                    name: {{ include "patchworks.passportSecretName" $root }}
                {{- with (concat $root.Values.app.extraEnvFrom $root.Values.workers.extraEnvFrom ($processor.extraEnvFrom | default (list)) $root.Values.scheduler.extraEnvFrom ($sched.extraEnvFrom | default (list))) }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              env:
                {{- include "patchworks.appSecretEnvRefs" $root | nindent 16 }}
                - name: APP_NAME
                  value: {{ $processorName | quote }}
                - name: APP_DOMAIN
                  value: {{ $queue | quote }}
                - name: RABBITMQ_QUEUE
                  value: {{ $queue | quote }}
                {{- with $root.Values.app.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
                {{- with $root.Values.workers.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
                {{- with $processor.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
                {{- with $root.Values.scheduler.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
                {{- with $sched.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- with $sched.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          {{- with $sched.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $sched.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $sched.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{ end }}
{{ end }}
{{ end }}
{{ end }}
