{{- if and .Values.s3Manager.enabled (not .Values.s3Manager.external.endpoint) }}
{{- $fullname := include "patchworks.fullname" . }}
{{- $ns := include "patchworks.s3Manager.namespace" . }}
{{- $s3ExistingSecret := fromJson (include "patchworks.s3.existingSecret" .) }}
{{- $s3AccessSecret := dict "name" $s3ExistingSecret.name "key" $s3ExistingSecret.accessKeyKey }}
{{- $s3SecretSecret := dict "name" $s3ExistingSecret.name "key" $s3ExistingSecret.secretKeyKey }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-s3-manager-config
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3-manager
data:
  config.yaml: |
    {{- include "patchworks.s3Manager.configYaml" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-s3-manager
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3-manager
spec:
  replicas: {{ .Values.s3Manager.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "patchworks.selectorLabels" (dict "component" "s3-manager" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "patchworks.selectorLabels" (dict "component" "s3-manager" "Release" .Release) | nindent 8 }}
      annotations:
        checksum/config: {{ include "patchworks.s3Manager.configYaml" . | sha256sum }}
        {{- with .Values.s3Manager.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "patchworks.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: s3-manager
          image: {{ include "patchworks.appImage" (dict "svc" .Values.s3Manager "root" .) | quote }}
          imagePullPolicy: {{ include "patchworks.appPullPolicy" (dict "svc" .Values.s3Manager "root" .) }}
          args:
            - --config=/etc/s3manager/config.yaml
          ports:
            - name: http
              containerPort: {{ .Values.s3Manager.service.port }}
          {{- with .Values.s3Manager.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{ include "patchworks.secretEnv" (dict "name" "S3_ACCESS_KEY_ID" "value" (include "patchworks.s3.accessKey" .) "secret" $s3AccessSecret) | nindent 12 }}
            {{ include "patchworks.secretEnv" (dict "name" "S3_SECRET_ACCESS_KEY" "value" (include "patchworks.s3.secretKey" .) "secret" $s3SecretSecret) | nindent 12 }}
            {{- with .Values.s3Manager.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/s3manager/config.yaml
              subPath: config.yaml
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          {{- with .Values.s3Manager.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-s3-manager-config
      {{- with .Values.s3Manager.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.s3Manager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.s3Manager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-s3-manager
  namespace: {{ $ns }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3-manager
spec:
  type: {{ .Values.s3Manager.service.type }}
  selector:
    {{- include "patchworks.selectorLabels" (dict "component" "s3-manager" "Release" .Release) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.s3Manager.service.port }}
      targetPort: http
{{- end }}
