{{- if include "patchworks.appSecretHasData" . }}
---
# Secret for sensitive core application environment variables.
# Loaded via envFrom in gateway, start, and standard worker pods when inline
# sensitive values are configured.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "patchworks.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchworks.labels" . | nindent 4 }}
{{- $data := include "patchworks.appSecretData" . | trim }}
{{- if $data }}
stringData:
  {{- $data | nindent 2 }}
{{- end }}
{{- end }}
