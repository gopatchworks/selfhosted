# values.yaml for a local kind cluster.
# Used by docs/advanced-install.md; the installer generates its own values file.
# app.url is set on the command line; app.key is generated when left empty.

app:
  env: local
  debug: "true"

# Reduce Elasticsearch heap for laptop/desktop memory budgets.
elasticsearch:
  javaOpts: "-Xms256m -Xmx256m"

# Two supervisord processes per worker for local development.
workers:
  processes: 2
