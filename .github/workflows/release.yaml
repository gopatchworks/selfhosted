name: Release Chart

# Triggered by pushing a tag matching the version in both Chart.yaml files.
# Process:
#   1. Update image tags in values.yaml and bump both Chart.yaml versions in a PR
#   2. Merge to main
#   3. git tag chart/v<version> && git push --tags
#   4. This workflow packages and publishes both charts

on:
  push:
    tags:
      - "chart/v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mikefarah/yq@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#chart/v}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches Chart.yaml files
        run: |
          app_version=$(yq '.version' charts/patchworks-app/Chart.yaml)
          infra_version=$(yq '.version' charts/patchworks-infra/Chart.yaml)
          if [ "$app_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "patchworks-app Chart.yaml version ($app_version) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi
          if [ "$infra_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "patchworks-infra Chart.yaml version ($infra_version) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Update app dependencies
        run: helm dependency update charts/patchworks-app

      - name: Update infra dependencies
        run: helm dependency update charts/patchworks-infra

      - name: Lint app chart
        run: helm lint charts/patchworks-app

      - name: Lint infra chart
        run: helm lint charts/patchworks-infra

      - name: Package app chart
        run: helm package charts/patchworks-app --destination .

      - name: Package infra chart
        run: helm package charts/patchworks-infra --destination .

      - name: Push to OCI registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin
          helm push "patchworks-app-${{ steps.version.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"
          helm push "patchworks-infra-${{ steps.version.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Build release notes
        id: notes
        run: |
          core=$(yq '.image.tag'                 charts/patchworks-app/values.yaml)
          mono=$(yq '.workers.mono.image.tag'    charts/patchworks-app/values.yaml)
          fabric=$(yq '.fabric.image.tag'        charts/patchworks-app/values.yaml)
          dashboard=$(yq '.dashboard.image.tag'  charts/patchworks-app/values.yaml)

          cat >> "$GITHUB_OUTPUT" <<EOF
          body<<NOTES
          ## Versions

          | Component   | Tag |
          |-------------|-----|
          | core        | \`$core\` |
          | monocore    | \`$mono\` |
          | fabric      | \`$fabric\` |
          | dashboard   | \`$dashboard\` |

          ## Install

          \`\`\`bash
          helm install patchworks-infra \\
            oci://ghcr.io/${{ github.repository_owner }}/charts/patchworks-infra \\
            --version ${{ steps.version.outputs.version }}

          helm install patchworks-app \\
            oci://ghcr.io/${{ github.repository_owner }}/charts/patchworks-app \\
            --version ${{ steps.version.outputs.version }}
          \`\`\`
          NOTES
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Chart v${{ steps.version.outputs.version }}" \
            --notes "${{ steps.notes.outputs.body }}" \
            "patchworks-app-${{ steps.version.outputs.version }}.tgz" \
            "patchworks-infra-${{ steps.version.outputs.version }}.tgz"
