name: Lint Chart

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/lint.yaml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update app dependencies
        run: helm dependency update charts/patchworks-app

      - name: Update infra dependencies
        run: helm dependency update charts/patchworks-infra

      - name: Lint app chart
        run: helm lint charts/patchworks-app

      - name: Lint infra chart
        run: helm lint charts/patchworks-infra

      - name: Template (standalone workers)
        run: helm template test charts/patchworks-app > /dev/null

      - name: Template (mono workers)
        run: helm template test charts/patchworks-app --set workers.type=mono > /dev/null

      - name: Template (microservice workers)
        run: helm template test charts/patchworks-app --set workers.type=microservice > /dev/null

      - name: Template app chart (all optionals enabled)
        run: |
          helm template test charts/patchworks-app \
            --set pusher.enabled=true \
            --set kubefaas.enabled=true \
            --set dashboard.enabled=true \
            > /dev/null

      - name: Template infra chart (all optionals enabled)
        run: |
          helm template test charts/patchworks-infra \
            --set pusher.enabled=true \
            --set kubefaas.enabled=true \
            --set dashboard.enabled=true \
            > /dev/null
