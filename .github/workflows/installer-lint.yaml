name: Lint Installer

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - ".goreleaser.yaml"
      - ".github/workflows/installer-lint.yaml"
      - ".github/workflows/installer-release.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Check formatting
        run: test -z "$(gofmt -l cmd/patchworks-installer)"

      - name: Test installer
        run: go test ./...

      - name: Build installer
        run: go build -ldflags "-s -w -X main.version=ci" -o /tmp/patchworks-installer ./cmd/patchworks-installer

      - name: Smoke test
        run: test "$(/tmp/patchworks-installer --version)" = "ci"
